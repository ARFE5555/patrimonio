  const [selMode, setSelMode] = useState(false);

  const usable = accounts.filter((a) => a.type === "bank" || a.type === "cash");
  const projects = useMemo(() => Array.from(new Set(txns.map((t) => t.project).filter(Boolean))).sort(), [txns]);
  const activos = (fAcct !== "all" ? 1 : 0) + (fKind !== "all" ? 1 : 0) + (fProject !== "all" ? 1 : 0) + (fFrom ? 1 : 0) + (fTo ? 1 : 0);
  const pendientes = useMemo(() => txns.filter((t) => t.pending), [txns]);

  /* Búsqueda: referencia del banco (código validador), motivo, descripción, cuenta,
     proyecto y monto. La referencia se compara normalizada, así da igual si la
     escribís con espacios, guiones o ceros al principio. */
  const qn = q.trim().toLowerCase();
  const qRef = normRef(q);
  const matchQ = (t) => {
    if (!qn) return true;
    if (qRef && normRef(t.ref).includes(qRef)) return true;
    const hay = [t.motivo, t.bankDesc, t.ref, t.project, acctName(t.accountId)]
      .filter(Boolean).join(" ").toLowerCase();
    if (hay.includes(qn)) return true;
    const nq = numVE(q);
    if (!isNaN(nq) && nq > 0 && Math.abs((t.amount || 0) - nq) < 0.005) return true;
    return false;
  };

  const filtrados = useMemo(
    () =>
      txns.filter(
        (t) =>
          (fAcct === "all" || t.accountId === fAcct) &&
          (fKind === "all" || t.kind === fKind) &&
          (fProject === "all" || (fProject === "__none" ? !t.project : t.project === fProject)) &&
          (!fFrom || t.date >= fFrom) &&
          (!fTo || t.date <= fTo) &&
          (!diaFijado || t.date === diaFijado) &&
          (!soloPend || !!t.pending) &&
          matchQ(t)
      ),
    [txns, fAcct, fKind, fProject, fFrom, fTo, soloPend, q, accounts, diaFijado]
  );

  const selIds = Object.keys(sel).filter((k) => sel[k]);
  const selTxns = selIds.map((id) => txns.find((t) => t.id === id)).filter(Boolean);
  function toggleSel(id) { setSel((s) => ({ ...s, [id]: !s[id] })); }
  function clearSel() { setSel({}); setSelMode(false); }
  // Selecciona SOLO los pendientes visibles. Marcar todo (incluidos los ya
  // justificados) sobreescribiría motivos correctos con un par de toques.
  const pendVisibles = filtrados.filter((t) => t.pending);
  function selectPendingVisible() {
    const m = {};
    pendVisibles.forEach((t) => { m[t.id] = true; });
    setSel(m);
  }

  // Si se justificó el último pendiente estando en modo "solo pendientes",
  // se sale solo: si no, la lista queda vacía y sin forma de volver.
  useEffect(() => {
    if (soloPend && pendientes.length === 0) setSoloPend(false);
  }, [soloPend, pendientes.length]);

  // Totales del filtro, agrupados por moneda
  const totalesPorMoneda = useMemo(() => {
    const m = {};
    filtrados.forEach((t) => {
      const c = acctCur(t);
      const com = t.commission || 0;
      if (!m[c]) m[c] = { inc: 0, exp: 0 };
      if (t.kind === "income") m[c].inc += (t.amount || 0) - com;
      else m[c].exp += (t.amount || 0) + com;
    });
    return Object.entries(m);
  }, [filtrados, accounts, cur]);

  const grouped = useMemo(() => {
    const m = {};
    filtrados.forEach((t) => {
      (m[t.date] = m[t.date] || []).push(t);
    });
    return Object.entries(m).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  }, [filtrados]);

  const selStyle = { ...inputStyle, appearance: "none", fontSize: 14, padding: "11px 12px" };

  const [bulkMsg, setBulkMsg] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkDl, setBulkDl] = useState(null);
  const acctById = (id) => accounts.find((a) => a.id === id);

  async function exportarEditable() {
    setBulkBusy(true); setBulkMsg("");
    try {
      const XLSX = await ensureXLSXStyle();
      const header = ["id", "Fecha", "Tipo", "Motivo", "Cuenta", "Monto", "Comisión", "Proyecto", "Referencia", "Descripción banco"];
      const aoa = [
        header,
        ...filtrados.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).map((t) => [
          t.id,
          t.date,
          t.kind === "income" ? "Ingreso" : "Egreso",
          t.motivo || "",
          (acctById(t.accountId) || {}).name || "",
          t.amount || 0,
          t.commission || 0,
          t.project || "",
          t.ref || "",
          t.bankDesc || "",
        ]),
      ];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [{ wch: 14 }, { wch: 12 }, { wch: 9 }, { wch: 26 }, { wch: 20 }, { wch: 12 }, { wch: 10 }, { wch: 16 }, { wch: 18 }, { wch: 30 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Movimientos");
      if (bulkDl && bulkDl.url) URL.revokeObjectURL(bulkDl.url);
      setBulkDl(wbToBlobUrl(XLSX, wb, "movimientos_editar.xlsx"));
      setBulkMsg("Archivo generado. Editá filas (o agregá nuevas con id vacío) y volvé a subirlo.");
    } catch (e) { setBulkMsg((e && e.message) || "No se pudo generar el archivo."); }
    finally { setBulkBusy(false); }
  }

  async function importarEditable(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setBulkBusy(true); setBulkMsg("Leyendo archivo…");
    try {
      const XLSX = await ensureXLSXStyle();
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
      const res = onBulkImport(rows);
      setBulkMsg(res.error ? res.error : `Listo: ${res.updated} modificado(s), ${res.added} nuevo(s)${res.skipped ? `, ${res.skipped} omitido(s)` : ""}.`);
    } catch (ex) { setBulkMsg((ex && ex.message) || "No se pudo leer el archivo."); }
    finally { setBulkBusy(false); }
  }

  return (
    <div style={{ paddingTop: 8 }}>
      {/* Día traído desde el cierre diario */}
      {diaFijado && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: T.goldSoft, border: `1px solid ${T.gold}`, borderRadius: 12, padding: "11px 14px", marginBottom: 12 }}>
          <span style={{ fontSize: 13.5, fontWeight: 600, color: T.gold }}>Solo el {fmtDate(diaFijado)}</span>
          {onLimpiarDia && (
            <button onClick={onLimpiarDia} style={{ ...btnGhost, color: T.gold, fontSize: 12.5, fontWeight: 600 }}>Ver todos</button>
          )}
        </div>
      )}

      {/* Buscador: la vía rápida para ubicar una transferencia por su referencia */}
      <div style={{ position: "relative", marginBottom: 12 }}>
        <input
          style={{ ...inputStyle, paddingLeft: 38, marginBottom: 0 }}
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="Buscar por referencia, monto, motivo…"
          inputMode="search"
        />
        <span style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)", color: T.mut2, fontSize: 15 }}>⌕</span>
        {q && (
          <button
            onClick={() => setQ("")}
            style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", ...btnGhost, color: T.mut2, fontSize: 18, lineHeight: 1 }}
            aria-label="Limpiar búsqueda"
          >×</button>
        )}
      </div>
      {q && (
        <div style={{ fontSize: 12.5, color: T.mut, marginBottom: 12 }}>
          {filtrados.length} resultado(s) para “{q}”
        </div>
      )}

      {/* Bandeja: movimientos importados que faltan justificar */}
      {canWrite && pendientes.length > 0 && (
        <button
          onClick={() => { setSoloPend((v) => !v); setQ(""); }}
          style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
            background: soloPend ? T.goldSoft : T.bg2, border: `1px solid ${soloPend ? T.gold : T.lineSoft}`,
            borderRadius: 14, padding: "13px 15px", marginBottom: 12, cursor: "pointer", fontFamily: FONT, textAlign: "left",
          }}
        >
          <span style={{ minWidth: 0 }}>
            <span style={{ display: "block", fontSize: 14, fontWeight: 700, color: T.gold }}>
              {pendientes.length} movimiento(s) por justificar
            </span>
            <span style={{ display: "block", fontSize: 12, color: T.mut, marginTop: 2 }}>
              {soloPend ? "Mostrando solo estos · tocá para ver todos" : "Importados del banco, sin motivo asignado"}
            </span>
          </span>
          <span style={{ color: T.gold, fontSize: 13, fontWeight: 600, flexShrink: 0 }}>{soloPend ? "Ver todos" : "Revisar →"}</span>
        </button>
      )}

      {canWrite && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <button onClick={onAdd} style={{ ...rowCard, flex: 1, cursor: "pointer", justifyContent: "center", gap: 8, color: T.gold, fontWeight: 600, fontSize: 14.5 }}>
            <IconPlus color={T.gold} /> Nuevo
          </button>
          <button onClick={onImportStatement} style={{ ...rowCard, flex: 1.4, cursor: "pointer", justifyContent: "center", gap: 8, color: T.blue, fontWeight: 600, fontSize: 14.5 }}>
            ⇩ Importar del banco
          </button>
        </div>
      )}

      {/* Barra de selección múltiple */}
      {canWrite && selMode && (
        <div style={{ background: T.card2, border: `1px solid ${T.gold}`, borderRadius: 14, padding: "12px 14px", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 10 }}>
            <span style={{ fontSize: 13.5, fontWeight: 600, color: T.text }}>{selIds.length} seleccionado(s)</span>
            <div style={{ display: "flex", gap: 8 }}>
              {pendVisibles.length > 0 && (
                <button onClick={selectPendingVisible} style={{ ...btnGhost, color: T.blue, fontSize: 12.5, fontWeight: 600 }}>
                  Los {pendVisibles.length} pendientes
                </button>
              )}
              <button onClick={clearSel} style={{ ...btnGhost, color: T.mut2, fontSize: 12.5, fontWeight: 600 }}>Salir</button>
            </div>
          </div>
          <PrimaryBtn color={T.green} disabled={selIds.length === 0} onClick={() => { onJustify(selTxns); clearSel(); }}>
            Justificar {selIds.length || ""} en lote
          </PrimaryBtn>
        </div>
      )}
      {canWrite && !selMode && filtrados.length > 1 && (
        <button onClick={() => setSelMode(true)} style={{ ...btnGhost, color: T.mut, fontSize: 12.5, fontWeight: 600, marginBottom: 12, padding: 0 }}>
          Seleccionar varios…
        </button>
      )}

      {/* Edición masiva por Excel */}
      <div style={{ background: T.bg2, border: `1px solid ${T.lineSoft}`, borderRadius: 14, padding: "12px 14px", marginBottom: 12, display: canWrite ? "block" : "none" }}>
        <div style={{ fontSize: 12.5, color: T.mut, marginBottom: 10, lineHeight: 1.5 }}>
          Edición masiva: exportá los movimientos (según los filtros), editalos en Excel y volvé a subirlos. Filas con <b>id</b> se modifican; con id vacío se crean.
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={exportarEditable} disabled={bulkBusy} style={{ flex: 1, background: "transparent", color: T.text, border: `1px solid ${T.line}`, borderRadius: 11, padding: "11px", fontSize: 13.5, fontWeight: 600, fontFamily: FONT, cursor: "pointer" }}>
            {bulkBusy ? "…" : "Exportar para editar"}
          </button>
          <label style={{ flex: 1, background: "transparent", color: T.blue, border: `1px solid ${T.blue}`, borderRadius: 11, padding: "11px", fontSize: 13.5, fontWeight: 600, fontFamily: FONT, cursor: "pointer", textAlign: "center" }}>
            Subir cambios
            <input type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={importarEditable} />
          </label>
        </div>
        {bulkDl && (
          <a href={bulkDl.url} download={bulkDl.name} style={{ display: "block", textAlign: "center", background: T.green, color: "#0A0F1E", borderRadius: 11, padding: "11px", fontWeight: 600, textDecoration: "none", marginTop: 8, fontSize: 13.5 }}>
            Abrir / guardar el Excel
          </a>
        )}
        {bulkMsg && <div style={{ fontSize: 12.5, color: T.mut, marginTop: 8, lineHeight: 1.5 }}>{bulkMsg}</div>}
      </div>

      {/* Filtros */}
      <button
        onClick={() => setShowF(!showF)}
        style={{ ...rowCard, cursor: "pointer", marginBottom: 12, color: T.text, fontSize: 14, fontWeight: 600 }}
      >
        <span>Filtros{activos ? ` · ${activos} activo(s)` : ""}</span>
        <span style={{ color: T.mut2, fontSize: 12 }}>{showF ? "▲" : "▼"}</span>
      </button>

      {showF && (
        <div style={{ background: T.bg2, border: `1px solid ${T.lineSoft}`, borderRadius: 14, padding: "14px 15px", marginBottom: 16 }}>
          <Field label="Cuenta">
            <select style={selStyle} value={fAcct} onChange={(e) => setFAcct(e.target.value)}>
              <option value="all">Todas las cuentas</option>
              {usable.map((a) => (
                <option key={a.id} value={a.id}>
                  {a.name} · {(a.currency || cur).toUpperCase()}
                </option>
              ))}
            </select>
          </Field>
          <Field label="Tipo">
            <select style={selStyle} value={fKind} onChange={(e) => setFKind(e.target.value)}>
              <option value="all">Ingresos y egresos</option>
              <option value="income">Solo ingresos</option>
              <option value="expense">Solo egresos</option>
            </select>
          </Field>
          <Field label="Proyecto">
            <select style={selStyle} value={fProject} onChange={(e) => setFProject(e.target.value)}>
              <option value="all">Todos los proyectos</option>
              <option value="__none">Sin proyecto</option>
              {projects.map((p) => (<option key={p} value={p}>{p}</option>))}
            </select>
          </Field>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}>
              <label style={labelStyle}>Desde</label>
              <input type="date" style={{ ...selStyle, fontFamily: MONO }} value={fFrom} onChange={(e) => setFFrom(e.target.value)} />
            </div>
            <div style={{ flex: 1 }}>
              <label style={labelStyle}>Hasta</label>
              <input type="date" style={{ ...selStyle, fontFamily: MONO }} value={fTo} onChange={(e) => setFTo(e.target.value)} />
            </div>
          </div>
          {activos > 0 && (
            <button
              onClick={() => { setFAcct("all"); setFKind("all"); setFProject("all"); setFFrom(""); setFTo(""); }}
              style={{ ...btnGhost, color: T.red, marginTop: 12, padding: 4 }}
            >
              Limpiar filtros
            </button>
          )}
        </div>
      )}

      {/* Totales del filtro */}
      {filtrados.length > 0 && totalesPorMoneda.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18 }}>
          {totalesPorMoneda.map(([c, v]) => (
            <div key={c} style={{ ...rowCard, background: T.bg2 }}>
              <span style={{ fontSize: 12, color: T.mut, fontWeight: 600 }}>{c.toUpperCase()}</span>
              <span style={{ fontFamily: MONO, fontSize: 13, fontVariantNumeric: "tabular-nums" }}>
                <span style={{ color: T.green }}>+{money(v.inc, c)}</span>
                <span style={{ color: T.mut2 }}>{"  /  "}</span>
                <span style={{ color: T.red }}>−{money(v.exp, c)}</span>
              </span>
            </div>
          ))}
        </div>
      )}

      {txns.length === 0 ? (
        <div style={emptyRow}>Todavía no cargaste ingresos ni egresos</div>
      ) : filtrados.length === 0 ? (
        <div style={emptyRow}>Ningún movimiento coincide con los filtros</div>
      ) : (
        grouped.map(([date, items]) => (
          <div key={date} style={{ marginBottom: 18 }}>
            <div style={{ ...sectionTitle, marginBottom: 8 }}>{fmtDate(date)}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {items.map((t) => {
                const inc = t.kind === "income";
                const c = acctCur(t);
                const pend = !!t.pending;
                const checked = !!sel[t.id];
                /* Los movimientos que vienen del banco se abren siempre en la ficha
                   de clasificación: ahí se pone el motivo y, si toca, se marca como
                   operación de divisas o se corrige la tasa ya cargada. Desde esa
                   misma ficha se salta a editar monto, fecha o cuenta.
                   Los cargados a mano siguen abriendo directo la edición. */
                const clasificable = pend || t.source === "bank" || t.divisaKind;
                const onRowClick = () => {
                  if (!canWrite) return;
                  if (selMode) { toggleSel(t.id); return; }
                  if (clasificable) { onJustify([t]); return; }
                  onEdit(t);
                };
                return (
                  <div
                    key={t.id}
                    onClick={onRowClick}
                    style={{
                      ...rowCard,
                      cursor: canWrite ? "pointer" : "default",
                      border: pend ? `1px solid ${T.gold}` : rowCard.border,
                      background: checked ? T.card2 : rowCard.background,
                    }}
                  >
                    <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
                      {canWrite && selMode && (
                        <span
                          style={{
                            width: 20, height: 20, borderRadius: 6, flexShrink: 0,
                            border: `1.5px solid ${checked ? T.gold : T.line}`,
                            background: checked ? T.gold : "transparent",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            color: "#0A0F1E", fontSize: 13, fontWeight: 700,
                          }}
                        >{checked ? "✓" : ""}</span>
                      )}
                      <span
                        style={{
                          width: 34, height: 34, borderRadius: 10,
                          background: inc ? T.greenSoft : T.redSoft,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          flexShrink: 0, color: inc ? T.green : T.red, fontSize: 18, fontWeight: 700,
                        }}
                      >
                        {inc ? "↓" : "↑"}
                      </span>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 14.5, fontWeight: 600, color: pend ? T.gold : T.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                          {t.motivo || t.bankDesc || (inc ? "Ingreso" : "Egreso")}
                          {pend && <span style={{ fontSize: 11, fontWeight: 700, color: T.gold, marginLeft: 6 }}>· POR JUSTIFICAR</span>}
                          {t.divisaKind && (
                            <span style={{ fontSize: 10.5, fontWeight: 700, color: T.violet, marginLeft: 6, letterSpacing: 0.3 }}>
                              · {t.divisaKind === "compra" ? "COMPRA DIVISA" : "VENTA DIVISA"}
                            </span>
                          )}
                        </div>
                        <div style={{ fontSize: 12, color: T.mut, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                          {acctName(t.accountId)} · {c.toUpperCase()}
                          {t.project ? ` · ${t.project}` : ""}
                          {t.commission ? ` · com. ${t.comMode === "usd" ? fmtUsd(t.comUsd || 0) : money(t.commission, c)}` : ""}
                        </div>
                        {t.ref && (
                          <div style={{ fontSize: 11, color: T.mut2, fontFamily: MONO, marginTop: 2 }}>ref {t.ref}</div>
                        )}
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontFamily: MONO, fontVariantNumeric: "tabular-nums", fontSize: 14.5, fontWeight: 600, color: inc ? T.green : T.red }}>
                        {inc ? "+" : "−"}
                        {money(t.amount, c)}
                      </span>
                      {canWrite && !selMode && (
                        <button onClick={(e) => { e.stopPropagation(); onDelete(t); }} style={{ ...btnGhost, color: T.mut2, fontSize: 18, lineHeight: 1 }} aria-label="Eliminar">
                          ×
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

/* ─────────────────────────────  Tab: Cierre diario  ─────────────────────────────
   Compara, día por día, el saldo que calcula la app contra el saldo que trae el
   propio estado de cuenta del banco. Si los dos coinciden, la caja de ese día
   está cuadrada y no hay nada que revisar. Si no, la diferencia dice cuánto
   falta o sobra, que suele ser un movimiento no cargado o cargado dos veces. */
function CierreDiarioTab({ txns, accounts, cur, onVerDia }) {
  const bancos = accounts.filter((a) => a.type === "bank" || a.type === "cash");
  const [accountId, setAccountId] = useState(bancos[0] ? bancos[0].id : "");
  const [abierto, setAbierto] = useState(null);

  useEffect(() => {
    if (!accountId && bancos[0]) setAccountId(bancos[0].id);
  }, [bancos.length]);

  const acct = bancos.find((a) => a.id === accountId);
  const acctCur = (acct && acct.currency) || cur;
  const delta = (t) => (t.kind === "income" ? (t.amount || 0) : -(t.amount || 0)) - (t.commission || 0);

  const dias = useMemo(() => {
    if (!acct) return [];
    const propios = txns.filter((t) => t.accountId === acct.id && t.date);
    const ordenados = propios.slice().sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 : (a.stmtRow || 0) - (b.stmtRow || 0)
    );
    const m = new Map();
    let acumulado = acct.opening || 0;
    ordenados.forEach((t) => {
      acumulado += delta(t);
      if (!m.has(t.date)) {
        m.set(t.date, { date: t.date, items: [], ingresos: 0, egresos: 0, comisiones: 0, pendientes: 0, bank: null, bankRow: -1 });
      }
      const d = m.get(t.date);
      d.items.push(t);
      if (t.kind === "income") d.ingresos += t.amount || 0;
      else d.egresos += t.amount || 0;
      d.comisiones += t.commission || 0;
      if (t.pending) d.pendientes++;
      // El saldo del banco del día es el de la última línea del estado de cuenta
      if (t.bankBalance != null && (t.stmtRow || 0) >= d.bankRow) { d.bank = t.bankBalance; d.bankRow = t.stmtRow || 0; }
      d.saldoApp = acumulado;
    });
    return Array.from(m.values()).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [txns, acct]);

  const conDato = dias.filter((d) => d.bank != null);
  const descuadrados = conDato.filter((d) => Math.abs(d.saldoApp - d.bank) > 0.01);
  const selStyle = { ...inputStyle, appearance: "none", fontSize: 14, padding: "11px 12px" };

  if (bancos.length === 0) return <div style={emptyRow}>Creá una cuenta de banco para ver el cierre diario.</div>;

  return (
    <div style={{ paddingTop: 8 }}>
      <Field label="Cuenta">
        <select style={selStyle} value={accountId} onChange={(e) => { setAccountId(e.target.value); setAbierto(null); }}>
          {bancos.map((a) => (<option key={a.id} value={a.id}>{a.name} · {(a.currency || cur).toUpperCase()}</option>))}
        </select>
      </Field>

      <div style={{ background: `linear-gradient(160deg, ${T.card2}, ${T.card})`, border: `1px solid ${T.line}`, borderRadius: 18, padding: 18, marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: T.mut, fontWeight: 500 }}>Días cuadrados contra el banco</div>
        <div style={{ fontFamily: MONO, fontVariantNumeric: "tabular-nums", fontSize: 30, fontWeight: 600, letterSpacing: -0.5, color: descuadrados.length ? T.gold : T.green, margin: "4px 0 2px" }}>
          {conDato.length - descuadrados.length} / {conDato.length}
        </div>
        <div style={{ fontSize: 12, color: T.mut2, lineHeight: 1.5 }}>
          {conDato.length === 0
            ? (dias.length === 0
                ? "Importá un estado de cuenta para poder cuadrar: el saldo del banco sale de ahí."
                : "El estado de cuenta de este banco no trae la columna de saldo, así que no se puede cuadrar día por día. El saldo total sí se verifica al importar, contra el saldo final del archivo.")
            : descuadrados.length === 0
              ? "Todos los días con dato del banco cuadran al céntimo."
              : `${descuadrados.length} día(s) con diferencia. Suele ser un movimiento sin cargar.`}
        </div>
      </div>

      {dias.length === 0 ? (
        <div style={emptyRow}>Esta cuenta todavía no tiene movimientos.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {dias.map((d) => {
            const dif = d.bank != null ? d.saldoApp - d.bank : null;
            const cuadra = dif != null && Math.abs(dif) <= 0.01;
            const open = abierto === d.date;
            const color = dif == null ? T.mut2 : cuadra ? T.green : T.red;
            return (
              <div key={d.date} style={{ background: T.card, border: `1px solid ${cuadra ? T.lineSoft : dif == null ? T.lineSoft : T.red}`, borderRadius: 14, overflow: "hidden" }}>
                <button
                  onClick={() => setAbierto(open ? null : d.date)}
                  style={{ width: "100%", background: "transparent", border: "none", padding: "13px 15px", cursor: "pointer", fontFamily: FONT, textAlign: "left" }}
                >
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 14.5, fontWeight: 600, color: T.text }}>{fmtDate(d.date)}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {d.pendientes > 0 && (
                        <span style={{ fontSize: 10.5, fontWeight: 700, color: T.gold, background: T.goldSoft, borderRadius: 6, padding: "3px 6px" }}>
                          {d.pendientes} s/justificar
                        </span>
                      )}
                      <span style={{ fontSize: 11.5, fontWeight: 700, color, letterSpacing: 0.3 }}>
                        {dif == null ? "SIN DATO" : cuadra ? "CUADRA" : "DIFERENCIA"}
                      </span>
                    </span>
                  </div>
                  <div style={{ display: "flex", gap: 12, marginTop: 6, fontSize: 12, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}>
                    <span style={{ color: T.green }}>+{money(d.ingresos, acctCur)}</span>
                    <span style={{ color: T.red }}>−{money(d.egresos, acctCur)}</span>
                    {d.comisiones > 0 && <span style={{ color: T.gold }}>com. {money(d.comisiones, acctCur)}</span>}
                  </div>
                  {dif != null && !cuadra && (
                    <div style={{ fontSize: 12, color: T.red, marginTop: 5 }}>
                      Diferencia de {money(Math.abs(dif), acctCur)} · {dif > 0 ? "la app tiene de más" : "la app tiene de menos"}
                    </div>
                  )}
                </button>

                {open && (
                  <div style={{ borderTop: `1px solid ${T.lineSoft}`, padding: "12px 15px", background: T.bg2 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: T.mut, marginBottom: 4 }}>
                      <span>Saldo según la app</span>
                      <span style={{ fontFamily: MONO, color: T.text }}>{money(d.saldoApp, acctCur)}</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: T.mut, marginBottom: 10 }}>
                      <span>Saldo según el banco</span>
                      <span style={{ fontFamily: MONO, color: d.bank == null ? T.mut2 : T.text }}>
                        {d.bank == null ? "no vino en el archivo" : money(d.bank, acctCur)}
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: T.mut2, marginBottom: 10 }}>{d.items.length} movimiento(s) ese día</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                      {d.items.slice(0, 12).map((t) => (
                        <div key={t.id} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 12.5 }}>
                          <span style={{ color: t.pending ? T.gold : T.text, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {t.motivo || t.bankDesc || "(sin motivo)"}
                          </span>
                          <span style={{ fontFamily: MONO, flexShrink: 0, color: t.kind === "income" ? T.green : T.red }}>
                            {t.kind === "income" ? "+" : "−"}{money(t.amount, acctCur)}
                          </span>
                        </div>
                      ))}
                      {d.items.length > 12 && <div style={{ fontSize: 12, color: T.mut2 }}>y {d.items.length - 12} más…</div>}
                    </div>
                    {onVerDia && (
                      <button
                        onClick={() => onVerDia(d.date)}
                        style={{ width: "100%", background: "transparent", color: T.blue, border: `1px solid ${T.blue}`, borderRadius: 11, padding: "10px", fontSize: 13, fontWeight: 600, fontFamily: FONT, cursor: "pointer" }}
                      >
                        Ver este día en Movimientos
                      </button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────  Importar estado de cuenta  ───────────────────────────── */
function StatementImportSheet({ open, onClose, accounts, cur, txns, onImport, onCreateAccount, onSetOpening }) {
  const usable = accounts.filter((a) => a.type === "bank" || a.type === "cash");
  const [creando, setCreando] = useState(false);
  const [nuevoNombre, setNuevoNombre] = useState("");
  const [nuevaMoneda, setNuevaMoneda] = useState("ves");
  const [nuevoSaldo, setNuevoSaldo] = useState("");
  const [fileName, setFileName] = useState("");
  const [rows, setRows] = useState(null);
  const [sheetNames, setSheetNames] = useState([]);
  const [wbRef, setWbRef] = useState(null);
  const [headerIdx, setHeaderIdx] = useState(0);
  const [map, setMap] = useState(null);
  const [signMode, setSignMode] = useState("cols");
  const [mergeCom, setMergeCom] = useState(true);
  const [accountId, setAccountId] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  const [done, setDone] = useState(null);

  useEffect(() => {
    if (open) {
      setFileName(""); setRows(null); setSheetNames([]); setWbRef(null);
      setHeaderIdx(0); setMap(null); setSignMode("cols"); setMergeCom(true);
      setAccountId(usable[0] ? usable[0].id : "");
      setBusy(false); setMsg(""); setErr(""); setDone(null);
      // Si todavía no hay ninguna cuenta, se abre directo el formulario para crearla.
      setCreando(usable.length === 0);
      setNuevoNombre(""); setNuevaMoneda("ves"); setNuevoSaldo("");
    }
  }, [open]);

  function applyRows(r) {
    setRows(r);
    const layout = detectStatementLayout(r);
    if (layout) {
      setHeaderIdx(layout.headerIdx);
      setMap(layout.map);
      setSignMode(layout.map.credito >= 0 || layout.map.debito >= 0 ? "cols" : "signed");
      setMsg(`Encabezado detectado en la fila ${layout.headerIdx + 1}. Revisá el mapeo antes de importar.`);
      // Si el archivo trae el saldo de apertura y se está creando la cuenta,
      // se propone como saldo inicial: es justo el dato que hace falta.
      const si = detectSaldoInicial(r, layout.headerIdx, layout.map);
      if (si && !nuevoSaldo) setNuevoSaldo(String(si.saldo).replace(".", ","));
    } else {
      setHeaderIdx(0);
      setMap({ fecha: -1, ref: -1, desc: -1, credito: -1, debito: -1, monto: -1, saldo: -1 });
      setSignMode("cols");
      setMsg("No pude reconocer el encabezado. Indicá a mano qué columna es cada cosa.");
    }
  }

  async function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setBusy(true); setErr(""); setMsg("Leyendo archivo…"); setDone(null);
    try {
      const buf = await f.arrayBuffer();
      // Solo se decodifica el arranque para saber de qué tipo es el archivo:
      // convertir un xlsx grande entero a texto sería tirar trabajo a la basura.
      const cabecera = decodeText(buf.slice(0, 1024));

      // Banesco (y otros bancos) entregan el estado de cuenta como una tabla
      // HTML con extensión .xls. Se detecta por el contenido, no por el nombre.
      if (looksLikeHtml(cabecera)) {
        const texto = decodeText(buf);
        const r = htmlTableToRows(texto);
        if (!r.length) throw new Error("El archivo es una página web pero no trae ninguna tabla.");
        setWbRef(null);
        setSheetNames([]);
        setFileName(f.name);
        applyRows(r);
        return;
      }

      const XLSX = await ensureXLSXStyle();
      const wb = XLSX.read(buf, { type: "array", cellDates: false });
      setWbRef(wb);
      setSheetNames(wb.SheetNames || []);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const r = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
      setFileName(f.name);
      applyRows(r);
    } catch (ex) {
      setErr((ex && ex.message) || "No se pudo leer el archivo.");
      setMsg("");
    } finally { setBusy(false); }
  }

  function pickSheet(name) {
    if (!wbRef) return;
    try {
      const XLSX = window.XLSX;
      const r = XLSX.utils.sheet_to_json(wbRef.Sheets[name], { header: 1, raw: false, defval: "" });
      applyRows(r);
    } catch (ex) { setErr("No se pudo leer esa hoja."); }
  }

  const header = rows && rows[headerIdx] ? rows[headerIdx] : [];
  const colOptions = useMemo(() => {
    const n = rows ? rows.reduce((m, r) => Math.max(m, (r || []).length), 0) : 0;
    return Array.from({ length: n }, (_, i) => ({
      idx: i,
      label: String(header[i] || "").trim() || `Columna ${i + 1}`,
    }));
  }, [rows, headerIdx]);

  const rawOps = useMemo(() => {
    if (!rows || !map) return [];
    try { return rowsToStatementOps(rows, headerIdx, map, signMode); } catch (e) { return []; }
  }, [rows, map, headerIdx, signMode]);

  // Referencia repetida = comisión de esa misma transferencia (ver mergeStatementCommissions)
  const ops = useMemo(() => (mergeCom ? mergeStatementCommissions(rawOps) : rawOps), [rawOps, mergeCom]);
  const comUnidas = useMemo(() => ops.reduce((s, o) => s + (o.comLines || 0), 0), [ops]);
  const refCompartidas = useMemo(() => ops.filter((o) => o.refCompartida).length, [ops]);

  const existing = useMemo(() => buildTxnIndex(txns), [txns]);
  const analysis = useMemo(() => {
    if (!accountId) return { nuevas: [], repetidas: 0, sinRef: 0 };
    // Presupuesto por clave: cuántas veces ya está registrada. Cada línea del
    // archivo consume una; cuando se agota, la línea es genuinamente nueva.
    const budget = new Map(existing);
    const nuevas = [];
    let repetidas = 0;
    const sinRef = ops.filter((o) => !o.refKey).length;
    ops.forEach((op) => {
      const k = stmtKeyOf(accountId, op);
      const left = budget.get(k) || 0;
      if (left > 0) { budget.set(k, left - 1); repetidas++; return; }
      nuevas.push(op);
    });
    return { nuevas, repetidas, sinRef };
  }, [ops, accountId, existing]);

  const acct = usable.find((a) => a.id === accountId);
  const acctCur = (acct && acct.currency) || cur;

  /* Rango de fechas del archivo y de lo que realmente entra. En una carga
     diaria esto es lo que se mira: qué días trae el archivo y desde cuándo
     hay algo nuevo. */
  const rango = useMemo(() => {
    const f = (lista) => {
      const ds = lista.map((o) => o.date).filter(Boolean).sort();
      return ds.length ? { desde: ds[0], hasta: ds[ds.length - 1], dias: new Set(ds).size } : null;
    };
    return { archivo: f(ops), nuevas: f(analysis.nuevas) };
  }, [ops, analysis.nuevas]);

  // Saldos de apertura y cierre que trae el propio archivo (Mercantil los
  // incluye como líneas; Banesco no trae ninguno)
  const saldoIni = useMemo(
    () => (rows && map ? detectSaldoInicial(rows, headerIdx, map) : null),
    [rows, map, headerIdx]
  );
  const saldoFin = useMemo(
    () => (rows && map ? detectSaldoFinal(rows, headerIdx, map) : null),
    [rows, map, headerIdx]
  );

  // Cuántas líneas se descartaron por ser saldo o subtotal, para que quede claro
  // que no se perdió nada por error
  const lineasDeSaldo = useMemo(() => {
    if (!rows || !map || map.desc < 0) return 0;
    let n = 0;
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const r = rows[i];
      if (r && esLineaDeSaldo(r[map.desc])) n++;
    }
    return n;
  }, [rows, map, headerIdx]);

  function setCol(field, value) {
    setMap((m) => ({ ...m, [field]: value }));
  }

  function doImport() {
    if (!accountId || analysis.nuevas.length === 0) return;
    const res = onImport(accountId, analysis.nuevas, { fileName });

    /* Comprobación contra el saldo de cierre del archivo. Es la única forma de
       validar bancos que no traen columna de saldo corrido: si el resultado no
       coincide, falta cargar algo (casi siempre el saldo inicial de la cuenta). */
    const delta = (t) => (t.kind === "income" ? (t.amount || 0) : -(t.amount || 0)) - (t.commission || 0);
    const previos = (txns || []).filter((t) => t.accountId === accountId).reduce((s, t) => s + delta(t), 0);
    const entrantes = analysis.nuevas.reduce((s, o) => s + delta(o), 0);
    setDone({
      ...res,
      saldoResultante: ((acct && acct.opening) || 0) + previos + entrantes,
      saldoBanco: saldoFin ? saldoFin.saldo : null,
    });
    setMsg("");
  }

  const selStyle = { ...inputStyle, appearance: "none", fontSize: 14, padding: "10px 12px" };
  const colSel = (field, label) => (
    <div style={{ flex: 1, minWidth: 0 }}>
      <label style={labelStyle}>{label}</label>
      <select style={selStyle} value={map ? map[field] : -1} onChange={(e) => setCol(field, Number(e.target.value))}>
        <option value={-1}>— sin usar —</option>
        {colOptions.map((c) => (<option key={c.idx} value={c.idx}>{c.label}</option>))}
      </select>
    </div>
  );

  function crearCuenta() {
    const nombre = nuevoNombre.trim();
    if (!nombre || !onCreateAccount) return;
    const id = onCreateAccount({
      type: "bank",
      name: nombre,
      currency: nuevaMoneda,
      opening: nuevoSaldo.trim() === "" ? 0 : (numVE(nuevoSaldo) || 0),
    });
    if (id) { setAccountId(id); setCreando(false); setNuevoNombre(""); setNuevoSaldo(""); }
  }

  /* Selector de cuenta destino. Se muestra dos veces: al principio y otra vez
     justo antes de importar, para que nunca se cargue un estado de cuenta en la
     cuenta equivocada por descuido. */
  const selectorCuenta = (label, permitirCrear) => (
    <Field label={label}>
      <select
        style={selStyle}
        value={creando && permitirCrear ? "__new" : accountId}
        onChange={(e) => {
          if (e.target.value === "__new") { setCreando(true); return; }
          setCreando(false); setAccountId(e.target.value);
        }}
      >
        {usable.length === 0 && <option value="">— todavía no hay cuentas —</option>}
        {usable.map((a) => (
          <option key={a.id} value={a.id}>{a.name} · {(a.currency || cur).toUpperCase()}</option>
        ))}
        {/* Crear cuenta se ofrece solo arriba: el formulario vive ahí y
            duplicarlo dejaba dos veces los mismos campos en pantalla. */}
        {onCreateAccount && permitirCrear && <option value="__new">+ Crear cuenta nueva…</option>}
      </select>
    </Field>
  );

  const formCuentaNueva = creando && onCreateAccount && (
    <div style={{ background: T.bg2, border: `1px solid ${T.lineSoft}`, borderRadius: 14, padding: "14px 15px", marginBottom: 14 }}>
      <div style={{ fontSize: 13, color: T.text, fontWeight: 600, marginBottom: 10 }}>Cuenta nueva</div>
      <Field label="Nombre del banco o cuenta">
        <input style={inputStyle} value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} placeholder="Ej. Banesco Corriente" />
      </Field>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <label style={labelStyle}>Moneda</label>
          <select style={selStyle} value={nuevaMoneda} onChange={(e) => setNuevaMoneda(e.target.value)}>
            <option value="ves">VES (Bs)</option>
            <option value="usd">USD ($)</option>
          </select>
        </div>
        <div style={{ flex: 1 }}>
          <label style={labelStyle}>Saldo inicial</label>
          <input style={{ ...inputStyle, fontFamily: MONO }} value={nuevoSaldo} onChange={(e) => setNuevoSaldo(e.target.value)} inputMode="decimal" placeholder="0,00" />
        </div>
      </div>
      <div style={{ fontSize: 11.5, color: T.mut2, lineHeight: 1.5, margin: "2px 0 12px" }}>
        El saldo inicial es el que tenía la cuenta ANTES de la primera línea del estado de
        cuenta. Si lo dejás en cero, el saldo mostrado será solo el movimiento del período.
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        {usable.length > 0 && (
          <button onClick={() => setCreando(false)} style={{ flex: 1, background: "transparent", color: T.mut, border: `1px solid ${T.line}`, borderRadius: 11, padding: "11px", fontSize: 13.5, fontWeight: 600, fontFamily: FONT, cursor: "pointer" }}>
            Cancelar
          </button>
        )}
        <div style={{ flex: 1.4 }}>
          <PrimaryBtn color={T.gold} disabled={!nuevoNombre.trim()} onClick={crearCuenta}>Crear cuenta</PrimaryBtn>
        </div>
      </div>
    </div>
  );

  return (
    <Sheet open={open} onClose={onClose} title="Importar estado de cuenta">
      {usable.length === 0 && !onCreateAccount ? (
        <div style={emptyRow}>Primero creá una cuenta de banco en la pestaña Cuentas.</div>
      ) : done ? (
        <div>
          <div style={{ background: T.greenSoft, border: `1px solid ${T.green}`, borderRadius: 14, padding: "16px 18px", marginBottom: 14 }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.green, marginBottom: 6 }}>Importación lista</div>
            <div style={{ fontSize: 13.5, color: T.text, lineHeight: 1.6 }}>
              {done.added} movimiento(s) cargado(s) en <b>{(acct || {}).name}</b>.<br />
              Quedaron marcados como <b>por justificar</b>: asignales el motivo desde la lista de movimientos.
            </div>
          </div>

          {done.saldoBanco != null && (() => {
            const dif = (done.saldoResultante || 0) - done.saldoBanco;
            const cuadra = Math.abs(dif) <= 0.01;
            return (
              <div style={{ background: cuadra ? T.bg2 : T.redSoft, border: `1px solid ${cuadra ? T.lineSoft : T.red}`, borderRadius: 14, padding: "14px 15px", marginBottom: 14 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: cuadra ? T.green : T.red, marginBottom: 8 }}>
                  {cuadra ? "La cuenta cierra igual que el banco" : "La cuenta no cierra igual que el banco"}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: T.mut }}>
                  <span>Saldo de la cuenta</span>
                  <span style={{ fontFamily: MONO, color: T.text }}>{money(done.saldoResultante, acctCur)}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: T.mut }}>
                  <span>Saldo final del archivo</span>
                  <span style={{ fontFamily: MONO, color: T.text }}>{money(done.saldoBanco, acctCur)}</span>
                </div>
                {!cuadra && (
                  <div style={{ fontSize: 12, color: T.red, lineHeight: 1.5, marginTop: 8 }}>
                    Diferencia de {money(Math.abs(dif), acctCur)}. Si es la primera carga, casi
                    siempre falta poner el saldo inicial de la cuenta
                    {saldoIni ? ` (el archivo abre con ${money(saldoIni.saldo, acctCur)})` : ""}.
                  </div>
                )}
              </div>
            );
          })()}

          <PrimaryBtn color={T.gold} onClick={onClose}>Ir a justificarlos</PrimaryBtn>
        </div>
      ) : (
        <>
          <div style={{ fontSize: 12.5, color: T.mut, lineHeight: 1.6, marginBottom: 14 }}>
            Subí el estado de cuenta tal como lo emite el banco, sin reformatearlo. Reconoce el
            .xls de Banesco (que en realidad es una tabla web). La <b>referencia</b> de cada línea
            se guarda como código validador y evita que se dupliquen movimientos si volvés a subir
            el mismo archivo.
          </div>

          {selectorCuenta("¿A qué cuenta corresponden estos movimientos?", true)}
          {formCuentaNueva}

          <label style={{ display: "block", background: "transparent", color: T.blue, border: `1px solid ${T.blue}`, borderRadius: 12, padding: "13px", fontSize: 14, fontWeight: 600, fontFamily: FONT, cursor: "pointer", textAlign: "center", marginBottom: 12 }}>
            {busy ? "Leyendo…" : fileName ? `Archivo: ${fileName} · cambiar` : "Elegir archivo del banco (.xls, .xlsx o .csv)"}
            <input type="file" accept=".xlsx,.xls,.csv,.htm,.html" style={{ display: "none" }} onChange={onFile} />
          </label>

          {sheetNames.length > 1 && (
            <Field label="Hoja del archivo">
              <select style={selStyle} onChange={(e) => pickSheet(e.target.value)}>
                {sheetNames.map((n) => (<option key={n} value={n}>{n}</option>))}
              </select>
            </Field>
          )}

          {msg && <div style={{ fontSize: 12.5, color: T.mut, lineHeight: 1.5, marginBottom: 12 }}>{msg}</div>}
          {err && <div style={{ fontSize: 12.5, color: T.red, lineHeight: 1.5, marginBottom: 12 }}>{err}</div>}

          {rows && map && (
            <>
              <div style={{ ...sectionTitle, marginTop: 6, marginBottom: 8 }}>Mapeo de columnas</div>

              <Field label="Fila del encabezado">
                <select style={selStyle} value={headerIdx} onChange={(e) => { const i = Number(e.target.value); setHeaderIdx(i); }}>
                  {rows.slice(0, 40).map((r, i) => (
                    <option key={i} value={i}>
                      {`Fila ${i + 1}: ${(r || []).filter(Boolean).slice(0, 4).join(" | ").slice(0, 48)}`}
                    </option>
                  ))}
                </select>
              </Field>

              <div style={{ display: "flex", gap: 10, marginBottom: 2 }}>
                {colSel("fecha", "Fecha")}
                {colSel("ref", "Referencia")}
              </div>
              <Field label="Descripción / concepto del banco">
                <select style={selStyle} value={map.desc} onChange={(e) => setCol("desc", Number(e.target.value))}>
                  <option value={-1}>— sin usar —</option>
                  {colOptions.map((c) => (<option key={c.idx} value={c.idx}>{c.label}</option>))}
                </select>
              </Field>

              <Field label="¿Cómo vienen los montos?">
                <select style={selStyle} value={signMode} onChange={(e) => setSignMode(e.target.value)}>
                  <option value="cols">Columnas separadas de débito y crédito</option>
                  <option value="signed">Una sola columna con signo (negativo = egreso)</option>
                  <option value="income">Una sola columna · todo son ingresos</option>
                  <option value="expense">Una sola columna · todo son egresos</option>
                </select>
              </Field>

              {signMode === "cols" ? (
                <div style={{ display: "flex", gap: 10 }}>
                  {colSel("credito", "Crédito (entra)")}
                  {colSel("debito", "Débito (sale)")}
                </div>
              ) : (
                colSel("monto", "Monto")
              )}

              <button
                onClick={() => setMergeCom((v) => !v)}
                style={{
                  width: "100%", textAlign: "left", background: mergeCom ? T.goldSoft : T.bg2,
                  border: `1px solid ${mergeCom ? T.gold : T.lineSoft}`, borderRadius: 12,
                  padding: "12px 14px", margin: "6px 0 14px", cursor: "pointer", fontFamily: FONT,
                }}
              >
                <div style={{ fontSize: 13.5, fontWeight: 600, color: mergeCom ? T.gold : T.text }}>
                  {mergeCom ? "✓ " : ""}La referencia repetida es la comisión
                </div>
                <div style={{ fontSize: 12, color: T.mut, marginTop: 3, lineHeight: 1.5 }}>
                  Cuando una referencia sale más de una vez, la línea menor se suma como comisión
                  del movimiento en lugar de cargarse aparte.
                </div>
              </button>

              <div style={{ background: T.bg2, border: `1px solid ${T.lineSoft}`, borderRadius: 14, padding: "14px 15px", margin: "14px 0" }}>
                <div style={{ fontSize: 13, color: T.text, fontWeight: 600, marginBottom: 8 }}>Resumen</div>
                {rango.archivo && (
                  <div style={{ fontSize: 12.5, color: T.mut, lineHeight: 1.7, marginBottom: 8, paddingBottom: 8, borderBottom: `1px solid ${T.lineSoft}` }}>
                    El archivo cubre del <b style={{ color: T.text }}>{fmtDate(rango.archivo.desde)}</b> al{" "}
                    <b style={{ color: T.text }}>{fmtDate(rango.archivo.hasta)}</b> ({rango.archivo.dias} día(s)).<br />
                    {rango.nuevas
                      ? <>Hay novedades desde el <b style={{ color: T.green }}>{fmtDate(rango.nuevas.desde)}</b> ({rango.nuevas.dias} día(s) con movimientos nuevos).</>
                      : <b style={{ color: T.mut2 }}>Todo lo del archivo ya está cargado.</b>}
                    {saldoFin && (
                      <><br />Según el archivo, la cuenta cierra en <b style={{ color: T.text }}>{money(saldoFin.saldo, acctCur)}</b>.</>
                    )}
                  </div>
                )}
                <div style={{ fontSize: 12.5, color: T.mut, lineHeight: 1.8 }}>
                  Líneas de movimiento en el archivo: <b style={{ color: T.text }}>{rawOps.length}</b><br />
                  {lineasDeSaldo > 0 && (
                    <>Líneas de saldo o subtotal ignoradas: <b style={{ color: T.mut2 }}>{lineasDeSaldo}</b><br /></>
                  )}
                  {comUnidas > 0 && (<>Comisiones unidas a su movimiento: <b style={{ color: T.gold }}>{comUnidas}</b><br /></>)}
                  Movimientos resultantes: <b style={{ color: T.text }}>{ops.length}</b><br />
                  Nuevos a importar: <b style={{ color: T.green }}>{analysis.nuevas.length}</b><br />
                  Ya registrados (se omiten): <b style={{ color: T.mut2 }}>{analysis.repetidas}</b>
                  {analysis.sinRef > 0 && (<><br />Sin referencia del banco: <b style={{ color: T.gold }}>{analysis.sinRef}</b></>)}
                </div>
                {refCompartidas > 0 && (
                  <div style={{ fontSize: 12, color: T.mut, lineHeight: 1.5, marginTop: 10 }}>
                    {refCompartidas} línea(s) comparten referencia pero no parecen comisión
                    (montos grandes o abonos, como las liquidaciones de punto de venta):
                    entran como movimientos separados.
                  </div>
                )}
              </div>

              {analysis.nuevas.length > 0 && (
                <>
                  <div style={{ ...sectionTitle, marginBottom: 8 }}>Vista previa</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
                    {analysis.nuevas.slice(0, 6).map((op, i) => (
                      <div key={i} style={{ ...rowCard, background: T.bg2, padding: "10px 12px" }}>
                        <div style={{ minWidth: 0 }}>
                          <div style={{ fontSize: 13, color: T.text, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                            {op.desc || "(sin descripción)"}
                          </div>
                          <div style={{ fontSize: 11.5, color: T.mut, fontFamily: MONO }}>
                            {op.date}{op.ref ? ` · ref ${op.ref}` : " · sin ref"}
                          </div>
                          {op.commission > 0 && (
                            <div style={{ fontSize: 11.5, color: T.gold, marginTop: 2 }}>
                              + comisión {money(op.commission, acctCur)}
                              {op.comLines > 1 ? ` (${op.comLines} líneas)` : ""}
                            </div>
                          )}
                        </div>
                        <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: 600, color: op.kind === "income" ? T.green : T.red, flexShrink: 0 }}>
                          {op.kind === "income" ? "+" : "−"}{money(op.amount, acctCur)}
                        </span>
                      </div>
                    ))}
                    {analysis.nuevas.length > 6 && (
                      <div style={{ fontSize: 12, color: T.mut2, textAlign: "center" }}>y {analysis.nuevas.length - 6} más…</div>
                    )}
                  </div>
                </>
              )}

              {/* Confirmación de destino: última oportunidad de corregir la cuenta */}
              <div style={{ background: T.card2, border: `1px solid ${acct ? T.gold : T.red}`, borderRadius: 14, padding: "14px 15px", marginBottom: 12 }}>
                <div style={{ fontSize: 12.5, color: T.mut, marginBottom: 8, lineHeight: 1.5 }}>
                  {analysis.nuevas.length > 0
                    ? `Se van a cargar ${analysis.nuevas.length} movimiento(s) en:`
                    : "Cuenta destino:"}
                </div>
                {selectorCuenta("Cuenta destino", false)}
                {acct ? (
                  <>
                    <div style={{ fontSize: 12, color: T.mut2, lineHeight: 1.5 }}>
                      Los montos se guardan en <b style={{ color: T.text }}>{acctCur.toUpperCase()}</b>, la
                      moneda de esta cuenta. Verificá que sea la del estado de cuenta.
                    </div>
                    {saldoIni && onSetOpening && Math.abs((acct.opening || 0) - saldoIni.saldo) > 0.01 && (
                      <button
                        onClick={() => onSetOpening(acct.id, saldoIni.saldo)}
                        style={{ width: "100%", marginTop: 10, background: "transparent", color: T.blue, border: `1px solid ${T.blue}`, borderRadius: 11, padding: "10px", fontSize: 12.5, fontWeight: 600, fontFamily: FONT, cursor: "pointer", lineHeight: 1.4 }}
                      >
                        El archivo abre con {money(saldoIni.saldo, acctCur)}
                        {saldoIni.date ? ` al ${fmtDate(saldoIni.date)}` : ""}.<br />
                        Usarlo como saldo inicial de la cuenta
                      </button>
                    )}
                  </>
                ) : (
                  <div style={{ fontSize: 12.5, color: T.red, lineHeight: 1.5 }}>
                    Elegí una cuenta antes de importar.
                  </div>
                )}
              </div>

              <PrimaryBtn color={T.green} disabled={analysis.nuevas.length === 0 || !accountId || creando} onClick={doImport}>
                {!accountId ? "Elegí la cuenta destino"
                  : analysis.nuevas.length === 0 ? "Nada nuevo para importar"
                  : `Importar ${analysis.nuevas.length} movimiento(s) en ${acct ? acct.name : ""}`}
              </PrimaryBtn>
            </>
          )}
        </>
      )}
    </Sheet>
  );
}

/* Intenta sacar el nombre del cliente de la descripción del banco.
   Banesco escribe las transferencias como:
     "TRF.MB 0134 V019224721 JIMENEZ WOLF EDUA 7101"
      ^tipo  ^banco ^cédula/RIF ^nombre        ^código
   Si no reconoce el formato devuelve "" y el campo queda para escribir a mano. */
function sugerirPersona(desc) {
  const s = String(desc || "").trim();
  let m = s.match(/^TRF\.[A-Z]{2}\s+\d{4}\s+[VJEGPvjegp]-?\d+\s+(.+?)\s+\d{3,}$/);
  if (m && m[1].trim().length > 2) return m[1].trim();
  m = s.match(/^TRF\.[A-Z]{2}\s+\d{4}\s+[VJEGPvjegp]-?\d+\s+(.+)$/);
  if (m && m[1].trim().length > 2) return m[1].trim();
  return "";
}

/* ─────────────────────────────  Justificar movimientos importados  ───────────────────────────── */
function JustifySheet({ state, projects, txns, cur, accounts, divisas, onClose, onSave, onEdit }) {
  const open = !!state;
  const target = (state && state.list) || [];
  const single = target.length === 1 ? target[0] : null;
  const [motivo, setMotivo] = useState("");
  const [project, setProject] = useState("");
  const [newProject, setNewProject] = useState("");
  const [applySimilar, setApplySimilar] = useState(false);
  // Operación de divisas asociada a este movimiento
  const [divKind, setDivKind] = useState("");   // "" | "compra" | "venta"
  const [persona, setPersona] = useState("");
  const [tasa, setTasa] = useState("");

  useEffect(() => {
    if (!state) return;
    setMotivo(single && single.motivo ? single.motivo : "");
    setProject(single && single.project ? single.project : "");
    setNewProject("");
    setApplySimilar(false);
    // Si el movimiento ya estaba marcado como divisa, se recuperan sus datos
    const yaDiv = single && single.divisaId
      ? (divisas || []).find((d) => d.id === single.divisaId)
      : null;
    setDivKind(yaDiv ? yaDiv.kind : "");
    setPersona(yaDiv ? (yaDiv.persona || "") : (single ? sugerirPersona(single.bankDesc) : ""));
    setTasa(yaDiv && yaDiv.tasa ? String(yaDiv.tasa) : "");
  }, [state]);

  /* Una compra de divisas sale de la cuenta (se paga en Bs) y una venta entra.
     Se propone según el tipo del movimiento, pero se puede cambiar. */
  const personasUsadas = useMemo(
    () => Array.from(new Set((divisas || []).map((d) => d.persona).filter(Boolean))).sort(),
    [divisas]
  );
  const montoVes = single ? (single.amount || 0) : 0;
  const nTasa = numVE(tasa);
  const usdCalc = divKind && nTasa > 0 ? montoVes / nTasa : 0;
  const divisaValida = !divKind || (nTasa > 0 && persona.trim() && single);

  /* "Similares": descripción del banco IDÉNTICA (sin quitar dígitos), misma
     cuenta y mismo tipo. Agrupar por texto aproximado juntaba cobros de
     clientes distintos ("PAGO MOVIL RECIBIDO 0414…" vs "…0424…"), así que se
     exige coincidencia exacta: sirve para comisiones, nóminas y cargos fijos. */
  const descKey = (t) => stmtNorm(t && t.bankDesc).replace(/\s+/g, " ");
  const similares = useMemo(() => {
    if (!single || !single.bankDesc) return [];
    const k = descKey(single);
    if (k.length < 6) return [];
    return (txns || []).filter(
      (t) => t.id !== single.id && t.pending && t.accountId === single.accountId && t.kind === single.kind && descKey(t) === k
    );
  }, [single, txns]);

  // Aviso: cuántos de los seleccionados ya tenían un motivo que se va a reemplazar.
  const yaJustificados = target.filter((t) => t.motivo && String(t.motivo).trim()).length;

  const proj = project === "__new" ? newProject.trim() : project;
  const valid = motivo.trim() && !(project === "__new" && !newProject.trim());
  const acctName = (id) => ((accounts || []).find((a) => a.id === id) || {}).name || "—";
  const selStyle = { ...inputStyle, appearance: "none", fontSize: 14, padding: "11px 12px" };

  return (
    <Sheet
      open={open}
      onClose={onClose}
      title={
        single
          ? (single.pending ? "Justificar movimiento" : "Clasificación del movimiento")
          : `Justificar ${target.length} movimientos`
      }
    >
      {single && (
        <div style={{ background: T.bg2, border: `1px solid ${T.lineSoft}`, borderRadius: 14, padding: "13px 15px", marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
            <span style={{ fontSize: 12, color: T.mut }}>{fmtDate(single.date)} · {acctName(single.accountId)}</span>
            <span style={{ fontFamily: MONO, fontSize: 15, fontWeight: 600, color: single.kind === "income" ? T.green : T.red }}>
              {single.kind === "income" ? "+" : "−"}{money(single.amount, single.currency || cur)}
            </span>
          </div>
          {single.bankDesc && <div style={{ fontSize: 13, color: T.text, marginTop: 6, lineHeight: 1.5 }}>{single.bankDesc}</div>}
          {single.commission > 0 && (
            <div style={{ fontSize: 12, color: T.gold, marginTop: 4 }}>
              Comisión del banco: {money(single.commission, single.currency || cur)}
            </div>
          )}
          {single.ref && (
            <div style={{ fontSize: 11.5, color: T.mut2, fontFamily: MONO, marginTop: 5 }}>Referencia {single.ref}</div>
          )}
          {onEdit && (
            <button
              onClick={() => { onClose(); onEdit(single); }}
              style={{ ...btnGhost, color: T.blue, fontSize: 12.5, fontWeight: 600, padding: "8px 0 0", marginTop: 4 }}
            >
              Corregir monto, fecha o cuenta →
            </button>
          )}
        </div>
      )}

      {!single && (
        <div style={{ fontSize: 12.5, color: T.mut, lineHeight: 1.6, marginBottom: 14 }}>
          Se aplicará el mismo motivo y proyecto a los {target.length} movimientos seleccionados.
        </div>
      )}

      {yaJustificados > 0 && (
        <div style={{ background: T.redSoft, border: `1px solid ${T.red}`, borderRadius: 12, padding: "12px 14px", marginBottom: 14, fontSize: 12.5, color: T.text, lineHeight: 1.5 }}>
          Atención: {yaJustificados} de estos movimientos ya tenían un motivo asignado y será <b>reemplazado</b>.
        </div>
      )}

      <Field label="Motivo / justificación">
        <input
          style={inputStyle}
          value={motivo}
          onChange={(e) => setMotivo(e.target.value)}
          placeholder="Ej. Pago a proveedor, Cobro cliente, Comisión bancaria…"
          list="motivos-usados"
        />
      </Field>
      <datalist id="motivos-usados">
        {Array.from(new Set((txns || []).map((t) => t.motivo).filter(Boolean))).slice(0, 60).map((m) => (
          <option key={m} value={m} />
        ))}
      </datalist>

      <Field label="Proyecto (opcional)">
        <select style={selStyle} value={project} onChange={(e) => setProject(e.target.value)}>
          <option value="">Sin proyecto</option>
          {(projects || []).map((p) => (<option key={p} value={p}>{p}</option>))}
          <option value="__new">+ Nuevo proyecto…</option>
        </select>
      </Field>
      {project === "__new" && (
        <Field label="Nombre del proyecto">
          <input style={inputStyle} value={newProject} onChange={(e) => setNewProject(e.target.value)} placeholder="Nombre" />
        </Field>
      )}

      {/* ── Operación de divisas ── */}
      {single && (
        <div style={{ background: T.bg2, border: `1px solid ${divKind ? T.violet : T.lineSoft}`, borderRadius: 14, padding: "14px 15px", marginBottom: 14 }}>
          <div style={{ fontSize: 13, color: T.text, fontWeight: 600, marginBottom: 4 }}>¿Es una operación de divisas?</div>
          <div style={{ fontSize: 12, color: T.mut, lineHeight: 1.5, marginBottom: 10 }}>
            Si lo marcás, se crea sola la operación en Divisas y en Cuentas por Cobrar.
            Solo hace falta el cliente y la tasa.
          </div>
          <div style={{ display: "flex", background: T.card, borderRadius: 12, padding: 4, marginBottom: divKind ? 14 : 0, gap: 2 }}>
            {[["", "No"], ["compra", "Compra"], ["venta", "Venta"]].map(([k, label]) => (
              <button
                key={k || "no"}
                onClick={() => setDivKind(k)}
                style={{
                  flex: 1, border: "none", borderRadius: 9, padding: "10px 6px", fontSize: 13.5, fontWeight: 600,
                  fontFamily: FONT, cursor: "pointer",
                  background: divKind === k ? (k ? T.violet : T.mut2) : "transparent",
                  color: divKind === k ? "#0A0F1E" : T.mut,
                }}
              >
                {label}
              </button>
            ))}
          </div>

          {divKind && (
            <>
              {((divKind === "compra" && single.kind !== "expense") || (divKind === "venta" && single.kind !== "income")) && (
                <div style={{ fontSize: 12, color: T.gold, lineHeight: 1.5, marginBottom: 10 }}>
                  Ojo: una compra de divisas normalmente sale de la cuenta y una venta entra.
                  Este movimiento es un {single.kind === "income" ? "ingreso" : "egreso"}.
                </div>
              )}
              <Field label="Cliente">
                <input style={inputStyle} value={persona} onChange={(e) => setPersona(e.target.value)} placeholder="Nombre del cliente" list="personas-divisas" />
              </Field>
              <datalist id="personas-divisas">
                {personasUsadas.map((p) => (<option key={p} value={p} />))}
              </datalist>

              <Field label={`Tasa (${(single.currency || cur).toUpperCase()} por USD)`}>
                <input style={{ ...inputStyle, fontFamily: MONO, fontSize: 20 }} value={tasa} onChange={(e) => setTasa(e.target.value)} inputMode="decimal" placeholder="0,00" />
              </Field>

              <div style={{ background: T.card, borderRadius: 12, padding: "12px 14px", fontSize: 12.5, color: T.mut, lineHeight: 1.9 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <span>Monto del movimiento</span>
                  <span style={{ fontFamily: MONO, color: T.text }}>{money(montoVes, single.currency || cur)}</span>
                </div>
                {single.commission > 0 && (
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <span>Comisión del banco</span>
                    <span style={{ fontFamily: MONO, color: T.gold }}>{money(single.commission, single.currency || cur)}</span>
                  </div>
                )}
                <div style={{ display: "flex", justifyContent: "space-between", borderTop: `1px solid ${T.lineSoft}`, marginTop: 6, paddingTop: 6 }}>
                  <span style={{ color: T.text, fontWeight: 600 }}>{divKind === "compra" ? "USD comprados" : "USD vendidos"}</span>
                  <span style={{ fontFamily: MONO, fontSize: 16, fontWeight: 600, color: nTasa > 0 ? T.violet : T.mut2 }}>
                    {nTasa > 0 ? fmtUsd(usdCalc) : "poné la tasa"}
                  </span>
                </div>
              </div>

              {divKind === "compra" && nTasa > 0 && persona.trim() && (
                <div style={{ fontSize: 12, color: T.mut2, lineHeight: 1.5, marginTop: 10 }}>
                  Va a quedar {fmtUsd(usdCalc)} por cobrar a {persona.trim()} en la pestaña CxC.
                </div>
              )}
            </>
          )}
        </div>
      )}

      {similares.length > 0 && !divKind && (
        <button
          onClick={() => setApplySimilar((v) => !v)}
          style={{
            width: "100%", textAlign: "left", background: applySimilar ? T.goldSoft : T.bg2,
            border: `1px solid ${applySimilar ? T.gold : T.lineSoft}`, borderRadius: 12,
            padding: "12px 14px", marginBottom: 14, cursor: "pointer", fontFamily: FONT,
          }}
        >
          <div style={{ fontSize: 13.5, fontWeight: 600, color: applySimilar ? T.gold : T.text }}>
            {applySimilar ? "✓ " : ""}Aplicar también a {similares.length} movimiento(s) similar(es)
          </div>
          <div style={{ fontSize: 12, color: T.mut, marginTop: 3, lineHeight: 1.5 }}>
            Otros movimientos por justificar con la misma descripción del banco.
          </div>
        </button>
      )}

      <PrimaryBtn
        color={divKind ? T.violet : T.green}
        disabled={!valid || !divisaValida}
        onClick={() => {
          const ids = target.map((t) => t.id).concat(applySimilar ? similares.map((t) => t.id) : []);
          // Siempre se informa del movimiento único: si divKind quedó vacío y
          // antes era una divisa, hay que deshacer esa operación.
          const divisa = single
            ? { txnId: single.id, kind: divKind || null, persona: persona.trim(), tasa: nTasa }
            : null;
          onSave(ids, { motivo: motivo.trim(), project: proj || undefined }, divisa);
        }}
      >
        {!divisaValida
          ? (!persona.trim() ? "Falta el cliente" : "Falta la tasa")
          : divKind === "compra" ? "Justificar y registrar la compra"
          : divKind === "venta" ? "Justificar y registrar la venta"
          : "Justificar"}
      </PrimaryBtn>
    </Sheet>
  );
}

/* ─────────────────────────────  Tab: Cripto  ───────────────────────────── */
function CryptoTab({ accounts, prices, cur, onAdd, onEdit, canEdit = true }) {
  const list = accounts.filter((a) => a.type === "crypto");
  return (
    <div style={{ paddingTop: 8 }}>
      {canEdit && (
        <button onClick={onAdd} style={{ ...rowCard, cursor: "pointer", justifyContent: "center", gap: 8, color: T.gold, fontWeight: 600, fontSize: 15, marginBottom: 20 }}>
          <IconPlus color={T.gold} /> Agregar cripto
        </button>
      )}
      {list.length === 0 ? (
        <div style={emptyRow}>Agregá tus tenencias (BTC, SOL, ETH o cualquier otra)</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {list.map((a) => {
            const p = prices[a.coinId];
            const livePrice = p?.price;
            const usedPrice = livePrice ?? a.manualPrice;
            const val = (a.amount || 0) * (usedPrice || 0);
            const up = (p?.change ?? 0) >= 0;
            return (
              <button key={a.id} onClick={() => onEdit(a)} style={{ ...rowCard, cursor: "pointer", textAlign: "left" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <CoinBadge sym={a.symbol} />
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 600, color: T.text }}>{a.name}</div>
                    <div style={{ fontSize: 12, color: T.mut, fontFamily: MONO }}>
                      {a.amount} {a.symbol} ·{" "}
                      {usedPrice != null ? coinPrice(usedPrice, cur) : "—"}
                      {livePrice == null && a.manualPrice != null ? " (manual)" : ""}
                    </div>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontFamily: MONO, fontVariantNumeric: "tabular-nums", fontSize: 15, color: T.text, fontWeight: 500 }}>
                    {money(val, cur)}
                  </div>
                  {p && (
                    <div style={{ fontSize: 12, fontWeight: 600, color: up ? T.green : T.red }}>
                      {pct(p.change)}
                    </div>
                  )}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────  Sheet: Cuenta banco/efectivo  ───────────────────────────── */
function AccountSheet({ state, cur, onClose, onSave, onDelete }) {
  const editing = state && state.id;
  const type = state?.type || "bank";
  const [name, setName] = useState("");
  const [balance, setBalance] = useState("");
  const [currency, setCurrency] = useState(cur);
  useEffect(() => {
    if (state) {
      setName(state.name || "");
      setBalance(state.id != null && state.opening != null ? String(state.opening) : "");
      setCurrency(state.currency || cur);
    }
  }, [state]);
  if (!state || type === "crypto") return null;
  // El saldo inicial es opcional: si se deja vacío, se toma 0 y el saldo saldrá
  // enteramente de los movimientos.
  const valid = name.trim() && (balance === "" || !isNaN(numVE(balance)));
  return (
    <Sheet open={!!state} onClose={onClose} title={editing ? "Editar cuenta" : `Nueva cuenta · ${TYPE_LABEL[type]}`}>
      <Field label="Nombre">
        <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder={type === "bank" ? "Ej. Banco Galicia" : "Ej. Efectivo billetera"} />
      </Field>
      <Field label="Moneda de la cuenta">
        <select style={{ ...inputStyle, appearance: "none" }} value={currency} onChange={(e) => setCurrency(e.target.value)}>
          {ACCOUNT_CURRENCIES.map((c) => (
            <option key={c.code} value={c.code}>{c.label}</option>
          ))}
        </select>
      </Field>
      <Field label={`Saldo inicial (${currency.toUpperCase()})`}>
        <input style={{ ...inputStyle, fontFamily: MONO }} value={balance} onChange={(e) => setBalance(e.target.value)} inputMode="decimal" placeholder="0.00" />
      </Field>
      <div style={{ fontSize: 12.5, color: T.mut, margin: "-6px 0 14px", lineHeight: 1.5 }}>
        Normalmente <b>0</b>. Es el saldo con el que arranca la cuenta, antes de sus movimientos.

      </div>
      <PrimaryBtn color={ACCENT[type]} disabled={!valid} onClick={() => onSave({ id: state.id, type, name: name.trim(), currency, opening: balance === "" ? 0 : numVE(balance) })}>
