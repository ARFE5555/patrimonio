// Comparación estable (ignora el orden de las claves y los undefined)
function stableStr(v) {
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map((x) => (x === undefined ? "null" : stableStr(x))).join(",") + "]";
  return "{" + Object.keys(v).filter((k) => v[k] !== undefined).sort()
    .map((k) => JSON.stringify(k) + ":" + stableStr(v[k])).join(",") + "}";
}

function notifySyncError(msg) {
  try { window.dispatchEvent(new CustomEvent("sync-error", { detail: msg })); } catch (e) { /* no-op */ }
}

let _sb = null;
async function getSB() {
  if (_sb) return _sb;
  if (!window.supabase) {
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
      s.onload = res;
      s.onerror = () => rej(new Error("No se pudo cargar Supabase. Revisá tu conexión."));
      document.head.appendChild(s);
    });
  }
  _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return _sb;
}

/* Colección sincronizada: local (localStorage) o nube (una fila por entidad, con realtime).
   Mantiene la misma API que useState, así el resto de la app no cambia. */
function useCollection(localKey, table, session, canWrite, refreshTick) {
  const [items, setItemsRaw] = useState([]);
  const [ready, setReady] = useState(false);
  const prev = useRef([]);
  const dirty = useRef(false);          // true SOLO cuando el cambio lo hizo el usuario
  const written = useRef(new Map());    // id -> { s, t }: nuestras escrituras recientes (para ignorar ecos)
  const cloud = CLOUD && !!session;

  // Setter local: únicamente los cambios del usuario disparan guardado.
  const setItems = (updater) => { dirty.current = true; setItemsRaw(updater); };

  /* Carga inicial y refrescos (refreshTick).
     CRÍTICO: en la nube NUNCA se marca "listo" tras un fallo. Arrancar con una
     lista vacía por un error de red/token llevaría a escrituras que duplican o
     pisan lo que está en el servidor. Se reintenta hasta lograr una lectura buena. */
  useEffect(() => {
    let alive = true;
    (async () => {
      setReady(false);
      if (!cloud) {
        const rows = await loadKey(localKey, []);
        if (!alive) return;
        prev.current = rows;
        dirty.current = false;
        setItemsRaw(rows);
        setReady(true);
        return;
      }
      for (let attempt = 0; alive; attempt++) {
        try {
          const sb = await getSB();
          const { data: s } = await sb.auth.getSession();
          if (!s || !s.session) throw new Error("Sesión no disponible todavía");
          const PAGE = 1000;
          let rows = [];
          for (let off = 0; ; off += PAGE) {
            const { data, error } = await sb.from(table).select("id,data").range(off, off + PAGE - 1);
            if (error) throw error;
            rows = rows.concat((data || []).map((r) => ({ id: r.id, ...(r.data || {}) })));
            if (!data || data.length < PAGE) break;
          }
          if (!alive) return;
          prev.current = rows;
          dirty.current = false;
          setItemsRaw(rows);
          setReady(true);
          return;
        } catch (e) {
          console.error("load " + table, e);
          await new Promise((r) => setTimeout(r, Math.min(5000, 700 * (attempt + 1))));
        }
      }
    })();
    return () => { alive = false; };
  }, [cloud, session && session.user && session.user.id, refreshTick]);

  // Realtime: cambios de otros usuarios. Se re-suscribe en cada refresco porque
  // iOS mata los websockets al pasar la app a segundo plano.
  useEffect(() => {
    if (!cloud) return;
    let ch = null, alive = true;
    (async () => {
      const sb = await getSB();
      if (!alive) return;
      ch = sb.channel("rt_" + table + "_" + (refreshTick || 0))
        .on("postgres_changes", { event: "*", schema: "public", table }, (p) => {
          setItemsRaw((cur) => {
            if (p.eventType === "DELETE") return cur.filter((x) => x.id !== (p.old || {}).id);
            const row = { id: (p.new || {}).id, ...((p.new || {}).data || {}) };
            const w = written.current.get(row.id);
            if (w && Date.now() - w.t < 15000) {
              // Fila que NOSOTROS escribimos hace instantes: si es el eco exacto se descarta;
              // si es un eco viejo (ya hicimos otra edición encima), también. Nuestra versión manda.
              if (w.s === stableStr(row)) written.current.delete(row.id);
              return cur;
            }
            const i = cur.findIndex((x) => x.id === row.id);
            if (i >= 0 && stableStr(cur[i]) === stableStr(row)) return cur;
            if (i < 0) return [row, ...cur];
            const c = cur.slice(); c[i] = row; return c;
          });
        })
        .subscribe();
    })();
    return () => { alive = false; if (ch) ch.unsubscribe(); };
  }, [cloud, table, refreshTick]);

  // Persistencia por diferencia: SOLO cambios locales (dirty), y solo lo que cambió
  useEffect(() => {
    if (!ready) return;
    const before = prev.current;
    prev.current = items;
    if (!dirty.current) return; // carga inicial, refresco o realtime: nada que guardar
    dirty.current = false;
    if (!cloud) { saveKey(localKey, items); return; }
    if (!canWrite) return;

    const byId = {};
    before.forEach((x) => { byId[x.id] = x; });
    const noId = items.filter((x) => x.id == null).length;
    if (noId) console.warn(table + ": " + noId + " elemento(s) sin id no se sincronizan");
    const ups = items
      .filter((x) => x.id != null)
      .filter((x) => { const p = byId[x.id]; return !p || stableStr(p) !== stableStr(x); })
      .map((x) => { const { id, ...data } = x; return { id, data, updated_at: new Date().toISOString() }; });
    // Dedupe defensivo: si dos elementos comparten id, sube solo el último
    const seenUp = new Set();
    for (let i = ups.length - 1; i >= 0; i--) {
      if (seenUp.has(ups[i].id)) ups.splice(i, 1);
      else seenUp.add(ups[i].id);
    }
    const ids = new Set(items.map((x) => x.id));
    const dels = Array.from(new Set(before.filter((x) => x.id != null && !ids.has(x.id)).map((x) => x.id)));
    if (!ups.length && !dels.length) return;

    // Registrar lo que vamos a escribir ANTES de enviarlo (el eco puede volver muy rápido)
    const now = Date.now();
    ups.forEach((u) => written.current.set(u.id, { s: stableStr({ id: u.id, ...u.data }), t: now }));
    written.current.forEach((v, k) => { if (now - v.t > 60000) written.current.delete(k); });

    (async () => {
      try {
        const sb = await getSB();
        const BATCH = 100;
        for (let i = 0; i < ups.length; i += BATCH) {
          const { error } = await sb.from(table).upsert(ups.slice(i, i + BATCH));
          if (error) throw error;
        }
        for (let i = 0; i < dels.length; i += BATCH) {
          const { error } = await sb.from(table).delete().in("id", dels.slice(i, i + BATCH));
          if (error) throw error;
        }
      } catch (e) {
        console.error("save " + table, e);
        notifySyncError("No se pudo guardar en la nube (" + table + "): " + ((e && e.message) || "error") + ". Tus últimos cambios podrían NO estar guardados. Verificá tu rol y tu conexión, y reintentá el cambio.");
      }
    })();
  }, [items, ready, cloud, canWrite]);

  return [items, setItems, ready];
}

/* Ajustes: una sola fila compartida (id = 'global') */
function useSettings(session, canWrite, defaults, refreshTick) {
  const [settings, setSettingsRaw] = useState(defaults);
  const [ready, setReady] = useState(false);
  const prev = useRef(defaults);
  const dirty = useRef(false);
  const written = useRef(null); // { s, t } de nuestra última escritura
  const cloud = CLOUD && !!session;

  const setSettings = (updater) => { dirty.current = true; setSettingsRaw(updater); };

  useEffect(() => {
    let alive = true;
    (async () => {
      setReady(false);
      if (!cloud) {
        const val = await loadKey("fin:settings", defaults);
        if (!alive) return;
        prev.current = val;
        dirty.current = false;
        setSettingsRaw(val);
        setReady(true);
        return;
      }
      for (let attempt = 0; alive; attempt++) {
        try {
          const sb = await getSB();
          const { data: s } = await sb.auth.getSession();
          if (!s || !s.session) throw new Error("Sesión no disponible todavía");
          const { data, error } = await sb.from("settings").select("data").eq("id", "global").maybeSingle();
          if (error) throw error;
          if (!alive) return;
          const val = data && data.data ? { ...defaults, ...data.data } : defaults;
          prev.current = val;
          dirty.current = false;
          setSettingsRaw(val);
          setReady(true);
          return;
        } catch (e) {
          console.error("load settings", e);
          await new Promise((r) => setTimeout(r, Math.min(5000, 700 * (attempt + 1))));
        }
      }
    })();
    return () => { alive = false; };
  }, [cloud, session && session.user && session.user.id, refreshTick]);

  useEffect(() => {
    if (!cloud) return;
    let ch = null, alive = true;
    (async () => {
      const sb = await getSB();
      if (!alive) return;
      ch = sb.channel("rt_settings_" + (refreshTick || 0))
        .on("postgres_changes", { event: "*", schema: "public", table: "settings" }, (p) => {
          if ((p.new || {}).id !== "global") return;
          setSettingsRaw((cur) => {
            const incoming = (p.new || {}).data || {};
            const w = written.current;
            if (w && Date.now() - w.t < 15000) {
              if (w.s === stableStr(incoming)) written.current = null;
              return cur; // eco (exacto o viejo) de nuestra propia escritura
            }
            const next = { ...cur, ...incoming };
            return stableStr(next) === stableStr(cur) ? cur : next;
          });
        })
        .subscribe();
    })();
    return () => { alive = false; if (ch) ch.unsubscribe(); };
  }, [cloud, refreshTick]);

  useEffect(() => {
    if (!ready) return;
    const before = prev.current;
    prev.current = settings;
    if (!dirty.current) return;
    dirty.current = false;
    if (!cloud) { saveKey("fin:settings", settings); return; }
    if (!canWrite) return;
    if (stableStr(before) === stableStr(settings)) return;
    written.current = { s: stableStr(settings), t: Date.now() };
    (async () => {
      try {
        const sb = await getSB();
        const { error } = await sb.from("settings").upsert([{ id: "global", data: settings, updated_at: new Date().toISOString() }]);
        if (error) throw error;
      } catch (e) {
        console.error("save settings", e);
        notifySyncError("No se pudieron guardar los ajustes en la nube: " + ((e && e.message) || "error"));
      }
    })();
  }, [settings, ready, cloud, canWrite]);

  return [settings, setSettings, ready];
}

async function loadKey(k, fb) {
  const raw = await store.get(k);
  if (!raw) return fb;
  try {
    return JSON.parse(raw);
  } catch {
    return fb;
  }
}
const saveKey = (k, v) => store.set(k, JSON.stringify(v));

/* ─────────────────────────────  Helpers  ───────────────────────────── */
const uid = () =>
  Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function money(n, cur, opts = {}) {
  const c = (cur || "usd").toUpperCase();
  try {
    return new Intl.NumberFormat("es-ES", {
      style: "currency",
      currency: c,
      minimumFractionDigits: opts.min ?? 2,
      maximumFractionDigits: opts.max ?? 2,
    }).format(Number.isFinite(n) ? n : 0);
  } catch {
    return `${(Number.isFinite(n) ? n : 0).toFixed(2)} ${c}`;
  }
}
function coinPrice(n, cur) {
  const abs = Math.abs(n || 0);
  const max = abs >= 100 ? 2 : abs >= 1 ? 2 : 6;
  return money(n, cur, { min: 2, max });
}
const pct = (n) => `${n >= 0 ? "+" : ""}${(n || 0).toFixed(2)}%`;
const fmtUsd = (n) =>
  "$ " + (Number.isFinite(n) ? n : 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtBs = (n) =>
  "Bs " + (Number.isFinite(n) ? n : 0).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COMISION = { mismo: 0, otros: 0.003 };
const COMISION_LABEL = { mismo: "Mismo banco (0%)", otros: "Otros bancos (0,3%)" };

// Comisión de una operación: usa el monto importado (comisionBs) si existe, si no la deriva del tipo
function comOp(d) {
  // comisión que consume VES (banco %, monto en VES, o importada)
  if (typeof d.comisionBs === "number" && !isNaN(d.comisionBs)) return d.comisionBs;
  const mode = d.comMode || "pct";
  if (mode === "ves") return d.comisionVesInput || 0;
  if (mode === "usd") return 0; // la comisión en USD NO consume bolívares
  return (d.usd || 0) * (d.tasa || 0) * (COMISION[d.comisionTipo] || 0);
}
function comUsdOf(d) {
  // comisión cobrada en USD (ej. fee P2P de Binance): reduce el USDT neto
  return d.comMode === "usd" ? (d.comisionUsdInput || 0) : 0;
}

// Capacidad de VES de una venta (generados menos comisión en VES)
const capOf = (v) => Math.max(0, (v.usd || 0) * (v.tasa || 0) - comOp(v));

// Asignación de compras a ventas:
//  - respeta las asignaciones manuales (compra.manualAllocs, en orden)
//  - el resto se asigna automáticamente por orden de FECHA (más antigua primero), fraccionando
// El automático no restringe por fecha: una compra puede alimentar una venta anterior o posterior.
function allocateFIFO(ventas, compras) {
  // Orden por FECHA (ascendente): las compras se asignan a las ventas cronológicamente.
  // En caso de empate de fecha, se usa el orden de carga (fila del Excel / creación) como desempate.
  const seq = (x) => (x.row != null ? x.row : (x.createdAt || 0));
  const dateKey = (x) => x.date || "";
  const arriv = (a, b) => (dateKey(a) < dateKey(b) ? -1 : dateKey(a) > dateKey(b) ? 1 : seq(a) - seq(b));
  const buckets = ventas.slice().sort(arriv).map((v) => ({ v, cap: capOf(v), used: 0 }));
  const byId = {};
  buckets.forEach((b) => { byId[b.v.id] = b; });
  const ventaStats = {};
  buckets.forEach((b) => { ventaStats[b.v.id] = { usdRecomprado: 0, usdBruto: 0, vesUsados: 0, allocs: [] }; });
  const unalloc = [];
  const EPS = 1e-6;

  const state = compras.slice().sort(arriv).map((c) => {
    const gross = c.usd || 0;
    const net = gross - comUsdOf(c); // USDT neto tras comisión en USD
    const W = gross * (c.tasa || 0) + comOp(c); // VES que consume (con comisión en VES)
    return { c, gross, net, W, remaining: W };
  });

  const put = (b, st, take, manual) => {
    const f = take / st.W;
    b.used += take;
    const s = ventaStats[b.v.id];
    s.usdRecomprado += st.net * f;
    s.usdBruto += st.gross * f;
    s.vesUsados += take;
    s.allocs.push({ compraId: st.c.id, compra: st.c, usd: st.gross * f, net: st.net * f, ves: take, manual: !!manual });
    st.remaining -= take;
  };

  // Paso A: asignaciones manuales (lista ordenada de ventas; llena cada una y pasa a la siguiente)
  for (const st of state) {
    if (st.W <= EPS) continue;
    const manual = st.c.manualAllocs && st.c.manualAllocs.length
      ? st.c.manualAllocs
      : (st.c.ventaId ? [st.c.ventaId] : []);
    for (const vid of manual) {
      if (st.remaining <= EPS) break;
      const b = byId[vid];
      if (!b) continue; // asignación manual: puede ir a cualquier venta, incluso posterior a la compra
      const take = Math.min(b.cap - b.used, st.remaining);
      if (take > EPS) put(b, st, take, true);
    }
  }

  // Paso B: FIFO automático para lo que quede (por orden de llegada, sin restricción de fecha)
  for (const st of state) {
    if (st.W <= EPS || st.remaining <= EPS) continue;
    for (const b of buckets) {
      if (st.remaining <= EPS) break;
      if (b.used >= b.cap - EPS) continue;
      const take = Math.min(b.cap - b.used, st.remaining);
      if (take > EPS) put(b, st, take, false);
    }
    if (st.remaining > EPS) {
      const f = st.remaining / st.W;
      unalloc.push({ compraId: st.c.id, compra: st.c, usd: st.gross * f, net: st.net * f, ves: st.remaining });
    }
  }

  Object.keys(ventaStats).forEach((k) => {
    ventaStats[k].allocs.sort((a, b) => arriv(a.compra, b.compra));
  });
  return { ventaStats, unalloc };
}

/* ── Multimoneda: conversión USD ↔ VES ── */
function latestRateFromHistory(settings, onOrBefore) {
  const hist = (settings && settings.rateHistory) || [];
  const elig = onOrBefore ? hist.filter((r) => r.date <= onOrBefore) : hist;
  if (!elig.length) return null;
  const latest = elig.slice().sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  return latest && latest.rate > 0 ? latest.rate : null;
}
function vesRateOf(settings, divisas) {
  const h = latestRateFromHistory(settings, null);
  if (h) return h;
  const manual = settings && Number(settings.vesRate);
  if (manual && manual > 0) return manual;
  const ops = (divisas || []).filter((d) => d.tasa > 0).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  return ops.length ? ops[0].tasa : null;
}
function rateForDate(settings, divisas, date) {
  const h = latestRateFromHistory(settings, date);
  if (h) return h;
  const ops = (divisas || []).filter((d) => d.tasa > 0 && d.date <= date).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  if (ops.length) return ops[0].tasa;
  return vesRateOf(settings, divisas);
}
function convertAmt(amount, from, to, rate) {
  if (!from || from === to) return amount;
  if (from === "usd" && to === "ves") return rate ? amount * rate : null;
  if (from === "ves" && to === "usd") return rate ? amount / rate : null;
  return null; // par no soportado
}

/* ── Lectura de Google Sheets (CSV publicado) ── */
function parseCSV(text) {
  const rows = [];
  let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignora */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function numVE(s) {
  if (s == null) return NaN;
  let t = String(s).replace(/[^\d.,-]/g, "").trim();
  if (t === "") return NaN;
  if (t.indexOf(".") >= 0 && t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.indexOf(",") >= 0) t = t.replace(",", ".");
  return parseFloat(t);
}
function fechaISO(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  // Año primero con barras o puntos: "2026/07/01" (formato de Banesco).
  // Antes caía en new Date(), que interpreta la fecha en la zona horaria del
  // equipo y podía correrla un día en husos al este de Greenwich.
  m = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let d = m[1].padStart(2, "0"), mo = m[2].padStart(2, "0"), y = m[3];
    if (y.length === 2) y = "20" + y;
    return `${y}-${mo}-${d}`;
  }
  const dt = new Date(s);
  if (!isNaN(dt.getTime())) return dt.toISOString().slice(0, 10);
  return s;
}
function parseDivisasCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const header = rows[0].map((h) => (h || "").toLowerCase().trim());
  const find = (...keys) => header.findIndex((h) => keys.some((k) => h === k || h.includes(k)));
  const iF = find("fecha"), iP = find("persona"), iT = find("tasa"),
    iR = find("referencia", "ref"), iTipo = find("tipo");
  const iU = header.findIndex((h) => (h === "usd" || h.includes("usd")) && !h.includes("comi") && !h.includes("fee"));
  const iComUsd = header.findIndex((h) => (h.includes("comi") || h.includes("fee")) && h.includes("usd"));
  const iCom = header.findIndex((h, idx) => h.includes("comi") && idx !== iComUsd);
  const out = [];
  const seenRef = {};
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every((c) => !String(c || "").trim())) continue;
    const usd = numVE(row[iU]);
    const tasa = numVE(row[iT]);
    if (isNaN(usd) || isNaN(tasa)) continue;
    const ves = usd * tasa;
    const tipoRaw = iTipo >= 0 ? String(row[iTipo] || "").toLowerCase() : "";
    const kind = tipoRaw.includes("venta") ? "venta" : "compra";
    const persona = iP >= 0 ? String(row[iP] || "").trim() : "";
    const referencia = iR >= 0 ? String(row[iR] || "").trim() : "";
    const date = fechaISO(row[iF]);
    let refKey = referencia || `${kind}|${date}|${usd}|${tasa}|${persona}`;
    // Referencias repetidas (o operaciones idénticas sin referencia): cada
    // ocurrencia recibe un sufijo estable para que sean operaciones distintas.
    const occ = (seenRef[refKey] = (seenRef[refKey] || 0) + 1);
    if (occ > 1) refKey = refKey + "#" + occ;
    const op = { kind, date, persona, usd, tasa, referencia, refKey, source: "sheet", row: out.length };
    const comUsd = iComUsd >= 0 ? numVE(row[iComUsd]) : NaN;
    if (!isNaN(comUsd) && comUsd > 0) {
      op.comMode = "usd";
      op.comisionUsdInput = comUsd;
    } else if (iCom >= 0) {
      const raw = String(row[iCom] || "");
      if (raw.indexOf("%") >= 0) { const p = numVE(raw); op.comisionBs = isNaN(p) ? 0 : ves * (p / 100); }
      else { const v = numVE(raw); op.comisionBs = isNaN(v) ? 0 : v; }
    } else {
      op.comisionBs = 0;
    }
    out.push(op);
  }
  return out;
}
function mergeSheetOps(prev, rows) {
  const prevSheet = prev.filter((d) => d.source === "sheet");
  const manual = prev.filter((d) => d.source !== "sheet");
  const prevByRef = {};
  prevSheet.forEach((d) => { if (d.refKey) prevByRef[d.refKey] = d; });
  // El orden de llegada es el orden de las filas del Sheet. Las operaciones ya
  // conocidas CONSERVAN su posición original (no se reindexan), y las que ya no
  // aparecen en el Sheet NO se borran: la nube es la fuente de verdad histórica.
  let nextRow = prevSheet.reduce((m, d) => Math.max(m, (d.row != null ? d.row : 0) + 1), 0);
  const seen = new Set();
  const merged = rows.map((r) => {
    seen.add(r.refKey);
    const ex = prevByRef[r.refKey];
    if (ex) {
      const pos = ex.row != null ? ex.row : (ex.createdAt || 0);
      // Si la comisión fue definida en la app (p. ej. fee de Binance en USD) y el
      // Sheet no trae una comisión USD propia, se preserva la de la app.
      const keepCom = ex.comMode && r.comMode !== "usd";
      return {
        ...r, id: ex.id, createdAt: pos, row: pos,
        manualAllocs: ex.manualAllocs, pagado: ex.pagado, hasReceipt: ex.hasReceipt, abonos: ex.abonos,
        ...(keepCom
          ? { comMode: ex.comMode, comisionTipo: ex.comisionTipo, comisionUsdInput: ex.comisionUsdInput, comisionVesInput: ex.comisionVesInput, comisionBs: undefined }
          : {}),
      };
    }
    const pos = nextRow++;
    return { ...r, id: uid(), createdAt: pos, row: pos };
  });
  const kept = prevSheet.filter((d) => !seen.has(d.refKey));
  return [...merged, ...kept, ...manual];
}

/* ── Comprobantes: guardados en IndexedDB (soporta archivos grandes) ── */
function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("Este navegador no soporta guardar comprobantes.")); return; }
    const r = window.indexedDB.open("patrimonio", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("receipts");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(id, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction("receipts", "readwrite");
    t.objectStore("receipts").put(val, id);
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
  });
}
async function idbGet(id) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction("receipts", "readonly");
    const rq = t.objectStore("receipts").get(id);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(id) {
  try {
    const db = await idbOpen();
    return new Promise((res) => {
      const t = db.transaction("receipts", "readwrite");
      t.objectStore("receipts").delete(id);
      t.oncomplete = () => res();
      t.onerror = () => res();
    });
  } catch { /* ignora */ }
}
// Comprime imágenes; los PDF u otros se leen tal cual (con límite de tamaño)
function fileToStored(file) {
  return new Promise((res, rej) => {
    if (file.type && file.type.indexOf("image/") === 0) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const maxDim = 1400;
        let { width, height } = img;
        if (width > height && width > maxDim) { height = (height * maxDim) / width; width = maxDim; }
        else if (height > maxDim) { width = (width * maxDim) / height; height = maxDim; }
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        res({ dataUrl: c.toDataURL("image/jpeg", 0.7), type: "image" });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("No se pudo leer la imagen.")); };
      img.src = url;
    } else {
      if (file.size > 6 * 1024 * 1024) { rej(new Error("El archivo es muy grande (máx. 6 MB).")); return; }
      const fr = new FileReader();
      fr.onload = () => res({ dataUrl: fr.result, type: "file", name: file.name });
      fr.onerror = () => rej(new Error("No se pudo leer el archivo."));
      fr.readAsDataURL(file);
    }
  });
}

/* ── Comprobantes compartidos: caché local (IndexedDB) + Supabase Storage ──
   En modo nube, el archivo se sube a Storage y cualquier dispositivo puede verlo.
   En modo local funciona igual que antes (solo IndexedDB). */
async function receiptPut(id, stored) {
  try { await idbPut(id, stored); } catch (e) { /* caché local opcional */ }
  if (!CLOUD) return;
  const sb = await getSB();
  const blob = new Blob([JSON.stringify(stored)], { type: "application/json" });
  const { error } = await sb.storage.from("receipts").upload(id + ".json", blob, { upsert: true, contentType: "application/json" });
  if (error) {
    notifySyncError("El comprobante quedó guardado solo en este dispositivo (no se pudo subir a la nube): " + (error.message || "error"));
    throw error;
  }
}
async function receiptGet(id) {
  const local = await idbGet(id).catch(() => null);
  if (local) return local;
  if (!CLOUD) return null;
  try {
    const sb = await getSB();
    const { data, error } = await sb.storage.from("receipts").download(id + ".json");
    if (error || !data) return null;
    const stored = JSON.parse(await data.text());
    idbPut(id, stored).catch(() => {});
    return stored;
  } catch (e) { return null; }
}
async function receiptDel(id) {
  try { await idbDel(id); } catch (e) { /* no-op */ }
  if (!CLOUD) return;
  try { const sb = await getSB(); await sb.storage.from("receipts").remove([id + ".json"]); } catch (e) { /* no-op */ }
}
function relTime(ts) {
  if (!ts) return "—";
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 5) return "recién";
  if (s < 60) return `hace ${s}s`;
  const m = Math.round(s / 60);
  return `hace ${m}m`;
}
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString()
    .slice(0, 10);
}
function fmtDate(iso) {
  try {
    return new Date(iso + "T00:00:00").toLocaleDateString("es-ES", {
      day: "2-digit",
      month: "short",
    });
  } catch {
    return iso;
  }
}

function AppMain({ session, role, signOut }) {

    return () => window.removeEventListener("sync-error", h);

  // (iOS corta los websockets en segundo plano y se pierden actualizaciones).

  const [tab, setTab] = useState("balance");

  const [prices, setPrices] = useState({});

  const [lastUpdate, setLastUpdate] = useState(null);
  const [source, setSource] = useState(null); // "CoinGecko" | "CoinPaprika"

  // sheets

  const [txnSheet, setTxnSheet] = useState(false);
  const [cryptoSheet, setCryptoSheet] = useState(false);

  const [projectsMeta, setProjectsMeta, rPrj] = useCollection("fin:projectsMeta", TABLES.projectsMeta, session, canEditAll, refreshTick);
  const [prestamos, setPrestamos, rPre] = useCollection("fin:prestamos", TABLES.prestamos, session, canWriteData, refreshTick);
  const [txnView, setTxnView] = useState("mov");

  const [justifySheet, setJustifySheet] = useState(null);  // { list: [txn, …] }
  const [divisaSheet, setDivisaSheet] = useState(null); // null | {kind,mode} | operacion

  /* Carga: las colecciones se sincronizan solas (local o nube) */
  const loaded = rAcc && rTxn && rSet && rDiv && rPrj;
  useEffect(() => {
    if (typeof document !== "undefined")
      document.documentElement.setAttribute("data-theme", settings.theme || "dark");
  }, [settings.theme]);
  const didAutoSync = useRef(false);
  useEffect(() => {
    if (didAutoSync.current) return;

      didAutoSync.current = true;
      syncSheet(settings.sheetUrl).catch(() => {});
    }
  }, [loaded, canWriteData, settings.sheetUrl]);

  /* Precios en vivo (24/7) */
  const trackedIds = useMemo(() => {
    const s = new Set(TICKER.map((t) => t.id));
    accounts.forEach((a) => a.type === "crypto" && a.coinId && s.add(a.coinId));
    return Array.from(s);
  }, [accounts]);

  useEffect(() => {
    if (!loaded) return;
    let alive = true;

    // Fuente 1: CoinGecko (soporta cualquier moneda y cualquier cripto)
    async function fromCoinGecko() {
      const url = `https://api.coingecko.com/api/v3/simple/price?ids=${trackedIds.join(
        ","
      )}&vs_currencies=${settings.currency}&include_24hr_change=true`;
      const r = await fetch(url);
      if (!r.ok) throw new Error("cg " + r.status);
      const d = await r.json();
      const next = {};
      trackedIds.forEach((id) => {
        if (d[id])
          next[id] = {
            price: d[id][settings.currency],
            change: d[id][settings.currency + "_24h_change"],
          };
      });
      if (!Object.keys(next).length) throw new Error("cg vacío");
      return next;
    }

    // Fuente 2: CoinPaprika (respaldo; solo USD en el plan gratuito)
    async function fromPaprika() {
      const next = {};
      await Promise.all(
        trackedIds.map(async (id) => {
          const pid = PAPRIKA[id];
          if (!pid) return;
          try {
            const r = await fetch(
              `https://api.coinpaprika.com/v1/tickers/${pid}?quotes=USD`
            );
            if (!r.ok) return;
            const d = await r.json();
            const q = d.quotes && d.quotes.USD;
            if (q) next[id] = { price: q.price, change: q.percent_change_24h };
          } catch {
            /* ignora la moneda que falle */
          }
        })
      );
      if (!Object.keys(next).length) throw new Error("paprika vacío");
      return next;
    }

    async function poll() {
      // Intento 1: CoinGecko
      try {
        const next = await fromCoinGecko();
        if (!alive) return;
        setPrices(next);
        setSource("CoinGecko");
        setPriceStatus("live");
        setLastUpdate(Date.now());
        return;

        /* pasa al respaldo */
      }
      // Intento 2: CoinPaprika (solo si la moneda base es USD, para no mostrar valores incorrectos)
      if (settings.currency === "usd") {

          const next = await fromPaprika();
          if (!alive) return;
          setPrices(next);
          setSource("CoinPaprika");
          setPriceStatus("live");
          setLastUpdate(Date.now());
          return;
        } catch {
          /* ambas fallaron */
        }
      }
      if (alive) setPriceStatus("error");
    }

    poll();
    const iv = setInterval(poll, 60000);
    return () => {
      alive = false;
      clearInterval(iv);
    };
  }, [loaded, trackedIds.join(","), settings.currency]);

  /* Totales */
  const cur = settings.currency;

  const vesRate = useMemo(() => vesRateOf(settings, divisas), [settings.vesRate, divisas]);
  const projects = useMemo(
    () => Array.from(new Set(txns.map((t) => t.project).filter(Boolean))).sort(),
    [txns]
  );

  // Saldo DERIVADO: el saldo de cada cuenta fiat se calcula desde sus movimientos
  // (saldo inicial de la cuenta + suma de sus movimientos). De esta forma el saldo
  // mostrado NUNCA se desincroniza de los movimientos, que son la fuente de verdad.
  const acctBalance = useMemo(() => {
    const m = {};
    accounts.forEach((a) => { if (a.type !== "crypto") m[a.id] = a.opening || 0; });
    txns.forEach((t) => {
      if (m[t.accountId] == null) return;
      m[t.accountId] += (t.kind === "income" ? (t.amount || 0) : -(t.amount || 0)) - (t.commission || 0);
    });
    return m;
  }, [accounts, txns]);

  // Cuentas con su saldo ya derivado. Se usa en toda la UI de lectura y reportes.
  const accountsView = useMemo(
    () => accounts.map((a) => (a.type === "crypto" ? a : { ...a, balance: acctBalance[a.id] || 0 })),
    [accounts, acctBalance]
  );

  const totals = useMemo(() => {
    let bank = 0, cash = 0, crypto = 0, sinConvertir = 0;
    accountsView.forEach((a) => {
      if (a.type === "crypto") {
        const p = prices[a.coinId]?.price ?? a.manualPrice;
        if (p != null) crypto += (a.amount || 0) * (p || 0);
        return;
      }
      const conv = convertAmt(a.balance || 0, a.currency || cur, cur, vesRate);
      if (conv == null) { sinConvertir++; return; }
      if (a.type === "bank") bank += conv;
      else if (a.type === "cash") cash += conv;
    });
    return { bank, cash, crypto, sinConvertir, net: bank + cash + crypto };
  }, [accountsView, prices, cur, vesRate]);


  const [winW, setWinW] = useState(typeof window !== "undefined" ? window.innerWidth : 1024);
  useEffect(() => {
    const onR = () => setWinW(window.innerWidth);
    window.addEventListener("resize", onR);
    return () => window.removeEventListener("resize", onR);
  }, []);
  const layoutMode = settings.layout || "auto";
  const desktop = layoutMode === "desktop" || (layoutMode === "auto" && winW >= 900);
  const NAV = [
    ["balance", "Balance", "Balance", IconChart],
    ["accounts", "Cuentas", "Cuentas", IconWallet],
    ["txns", "Movimientos", "Movim.", IconSwap],
    ["crypto", "Cripto", "Cripto", IconCoin],
    ["divisas", "Divisas", "Divisas", IconExchange],
    ["concil", "Conciliar", "Concil.", IconCheck],
    ["ajustes", "Ajustes", "Ajustes", IconGear],
  ];

  /* Acciones cuentas */
  function saveAccount(data) {
    setAccounts((prev) => {
      if (data.id) return prev.map((a) => (a.id === data.id ? { ...a, ...data } : a));
      return [...prev, { ...data, id: uid() }];
    });
    setAcctSheet(null);
    setCryptoSheet(false);
  }
  function deleteAccount(id) {
    setAccounts((prev) => prev.filter((a) => a.id !== id));
    setTxns((prev) => prev.filter((t) => t.accountId !== id));
    setAcctSheet(null);
  }

  /* Acciones movimientos */
  const txnDelta = (t) => (t.kind === "income" ? t.amount : -t.amount) - (t.commission || 0);
  function saveTxn(data) {
    // El saldo de la cuenta se deriva de los movimientos (ver acctBalance/accountsView),
    // por eso acá sólo se guarda el movimiento. No se toca ningún saldo de cuenta.
    // Si se le puso motivo a un movimiento importado, deja de estar "por justificar".
    const patch = data.motivo && data.motivo.trim() ? { ...data, pending: false } : data;
    setTxns((prev) => {
      if (data.id) return prev.map((x) => (x.id === data.id ? { ...x, ...patch } : x));
      return [{ ...patch, id: uid(), createdAt: Date.now() }, ...prev];
    });
    setTxnSheet(false);
  }
  function deleteTxn(t) {
    // Al borrar el movimiento, el saldo de la cuenta se recalcula solo.
    setTxns((prev) => prev.filter((x) => x.id !== t.id));
    // Si el movimiento había generado una operación de divisas, se va con él:
    // dejarla suelta descuadraría Divisas y Cuentas por Cobrar.
    if (t && t.divisaId) {
      setDivisas((prev) => prev.filter((d) => d.id !== t.divisaId));
      receiptDel(t.divisaId);
    }
    setTxnSheet(false);
  }
  function bulkImportTxns(rows) {
    if (!rows || rows.length < 2) return { error: "El archivo no tiene datos." };
    const norm = (s) => String(s || "").toLowerCase().trim();
    const header = rows[0].map(norm);
    const col = (...keys) => header.findIndex((h) => keys.some((k) => h === k || h.includes(k)));
    const iId = col("id"), iFecha = col("fecha"), iTipo = col("tipo"), iMotivo = col("motivo"),
      iCuenta = col("cuenta"), iMonto = col("monto"), iCom = col("comis"), iProj = col("proyecto"),
      iRef = col("referencia");
    if (iFecha < 0 || iMonto < 0 || iCuenta < 0) return { error: "Faltan columnas (Fecha, Cuenta, Monto)." };
    const acctByName = {};
    accounts.forEach((a) => { if (a.type === "bank" || a.type === "cash") acctByName[norm(a.name)] = a; });
    let updated = 0, added = 0, skipped = 0;
    const balDelta = {};
    const addD = (id, d) => { balDelta[id] = (balDelta[id] || 0) + d; };
    const newTxns = [], updates = {};
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.every((c) => !String(c || "").trim())) continue;
      const acc = acctByName[norm(row[iCuenta])];
      const monto = numVE(row[iMonto]);
      if (!acc || isNaN(monto) || monto <= 0) { skipped++; continue; }
      const tipoRaw = iTipo >= 0 ? norm(row[iTipo]) : "";
      const kind = tipoRaw.indexOf("ingr") === 0 || tipoRaw.includes("income") ? "income" : "expense";
      const commission = iCom >= 0 ? (numVE(row[iCom]) || 0) : 0;
      const data = {
        kind, amount: monto,
        motivo: iMotivo >= 0 ? String(row[iMotivo] || "").trim() : "",
        accountId: acc.id,
        date: iFecha >= 0 ? fechaISO(row[iFecha]) : todayISO(),
        currency: acc.currency || cur,
        commission, comMode: commission > 0 ? "manual" : "none",
        project: iProj >= 0 && String(row[iProj] || "").trim() ? String(row[iProj]).trim() : undefined,
      };
      if (data.motivo) data.pending = false;
      if (iRef >= 0) {
        const ref = String(row[iRef] || "").trim();
        if (ref) { data.ref = ref; data.refKey = stmtRefKey(ref); }
      }
      const id = iId >= 0 ? String(row[iId] || "").trim() : "";
      const old = id ? txns.find((t) => t.id === id) : null;
      if (old) {
        addD(old.accountId, -txnDelta(old));
        addD(data.accountId, txnDelta(data));
        updates[id] = data; updated++;
      } else {
        addD(data.accountId, txnDelta(data));
        newTxns.push({ ...data, id: uid(), createdAt: Date.now() }); added++;
      }
    }
    setTxns((prev) => [...newTxns, ...prev.map((t) => (updates[t.id] ? { ...t, ...updates[t.id] } : t))]);
    // No se ajustan saldos: se derivan automáticamente de los movimientos.
    return { updated, added, skipped };
  }

  /* Crea una cuenta desde el importador y devuelve su id, para poder cargarle
     el estado de cuenta sin salir del flujo. Solo para el rol editor, igual
     que la creación de cuentas en la pestaña Cuentas. */
  function createAccountInline(data) {
    if (!canEditAll) return null;
    const id = uid();
    setAccounts((prev) => [...prev, { ...data, id }]);
    return id;
  }

  /* Importa las líneas de un estado de cuenta como movimientos por justificar.
     Se guardan la referencia del banco (código validador) y su descripción tal cual,
     y quedan con pending:true hasta que se les asigne un motivo. El saldo de la
     cuenta se recalcula solo, porque se deriva de los movimientos. */
  function importStatement(accountId, ops, meta) {
    if (!accountId || !ops || ops.length === 0) return { added: 0 };
    // Si la cuenta se acaba de crear puede no estar todavía en este render:
    // se usa la moneda general como respaldo en lugar de abortar la carga.
    const acc = accounts.find((a) => a.id === accountId) || { currency: cur };
    const importedAt = Date.now();
    const nuevos = ops.map((op, i) => ({
      id: uid(),
      createdAt: importedAt - i,
      kind: op.kind,
      amount: op.amount,
      motivo: "",
      accountId,
      date: op.date,
      currency: acc.currency || cur,
      // Comisión venida del propio estado de cuenta (líneas con la referencia
      // repetida). El saldo derivado ya la resta, igual que hace el banco.
      commission: op.commission || 0,
      comMode: op.commission > 0 ? "manual" : "none",
      ref: op.ref || "",
      refKey: op.refKey || "",
      bankDesc: op.desc || "",
      // Saldo del banco y posición en el archivo: se usan para el cuadre diario
      bankBalance: op.bankBalance,
      stmtRow: op.rowNum,
      pending: true,
      source: "bank",
      importedAt,
      importFile: (meta && meta.fileName) || undefined,
    }));
    setTxns((prev) => [...nuevos, ...prev]);
    return { added: nuevos.length };
  }

  /* Justificar: asigna motivo (y proyecto) y saca el movimiento de la bandeja.
     Si además se marcó como operación de divisas, crea (o actualiza, o borra)
     la operación correspondiente en Divisas, que es la que alimenta CxC.

     Los USD salen del propio movimiento: usd = monto ÷ tasa. La comisión del
     banco se traslada como comisión en bolívares de la operación, así los VES
     que consume la compra coinciden con lo que realmente salió de la cuenta. */
  function justifyTxns(ids, patch, divisa) {
    const set = new Set(ids || []);
    if (set.size === 0) return;

    const t = divisa ? txns.find((x) => x.id === divisa.txnId) : null;
    let nuevoDivisaId;

    if (t) {
      const anterior = t.divisaId;
      if (!divisa.kind) {
        // Se desmarcó: se elimina la operación de divisas que se había creado
        if (anterior) { setDivisas((prev) => prev.filter((d) => d.id !== anterior)); receiptDel(anterior); }
        nuevoDivisaId = null;
      } else if (divisa.tasa > 0 && divisa.persona) {
        const datos = {
          kind: divisa.kind,
          date: t.date,
          persona: divisa.persona,
          usd: (t.amount || 0) / divisa.tasa,
          tasa: divisa.tasa,
          referencia: t.ref || "",
          refKey: t.ref ? normRef(t.ref) : undefined,
          // La comisión del banco se expresa en bolívares dentro de la operación
          comisionBs: t.commission || 0,
          source: "movimiento",
          txnId: t.id,
        };
        if (anterior && divisas.some((d) => d.id === anterior)) {
          nuevoDivisaId = anterior;
          setDivisas((prev) => prev.map((d) => (d.id === anterior ? { ...d, ...datos } : d)));
        } else {
          nuevoDivisaId = uid();
          const id = nuevoDivisaId;
          setDivisas((prev) => [{ ...datos, id, createdAt: Date.now() }, ...prev]);
        }
      }
    }

    setTxns((prev) =>
      prev.map((x) => {
        if (!set.has(x.id)) return x;
        const base = { ...x, motivo: patch.motivo, project: patch.project || x.project, pending: false };
        if (t && x.id === t.id && nuevoDivisaId !== undefined) {
          base.divisaId = nuevoDivisaId || undefined;
          base.divisaKind = nuevoDivisaId ? divisa.kind : undefined;
        }
        return base;
      })
    );
  }

  /* Acciones divisas */
  function saveDivisa(data) {
    setDivisas((prev) => {
      if (data.id) return prev.map((d) => (d.id === data.id ? { ...d, ...data } : d));
      return [{ ...data, id: uid(), createdAt: Date.now() }, ...prev];
    });
    setDivisaSheet(null);
  }
  function addAbono(data) {
    setDivisas((prev) => [{ ...data, kind: "abono", id: uid(), createdAt: Date.now() }, ...prev]);
  }
  function deleteDivisa(id) {
    setDivisas((prev) => prev.filter((d) => d.id !== id));
    receiptDel(id);
    setDivisaSheet(null);
  }
  function patchDivisa(id, patch) {
    setDivisas((prev) => prev.map((d) => (d.id === id ? { ...d, ...patch } : d)));
  }
  function setVesRate(date, rate) {
    if (!(rate > 0) || !date) return;
    setSettings((s) => {
      const hist = (s.rateHistory || []).filter((r) => r.date !== date);
      return { ...s, rateHistory: [...hist, { date, rate }].sort((a, b) => (a.date < b.date ? -1 : 1)) };
    });
  }
  function restoreBackup(d) {
    // Repara ids faltantes o duplicados (de datos con el bug viejo) sin perder filas
    const fixIds = (arr) => {
      const seen = new Set();
      return (arr || []).map((x) => {
        let id = x.id;
        if (id == null || seen.has(id)) id = uid();
        seen.add(id);
        return { ...x, id };
      });
    };
    if (d.accounts) setAccounts(fixIds(d.accounts));
    if (d.txns) setTxns(fixIds(d.txns));
    if (d.divisas) setDivisas(fixIds(d.divisas));
    if (d.prestamos) setPrestamos(fixIds(d.prestamos));
    if (d.projectsMeta) setProjectsMeta(d.projectsMeta.map((m) => ({ ...m, id: m.id || m.name })));
    if (d.settings) setSettings((s) => ({ ...s, ...d.settings }));
  }
  function saveProject(oldName, data) {
    const name = (data.name || "").trim();
    if (!name) return;
    if (oldName && oldName !== name) {
      setTxns((prev) => prev.map((t) => (t.project === oldName ? { ...t, project: name } : t)));
    }
    setProjectsMeta((prev) => {
      const filt = prev.filter((m) => m.name !== oldName && m.name !== name);
      return [...filt, { id: name, name, color: data.color, emoji: data.emoji, opening: data.opening || {} }];
    });
    setProjectSheet(null);
  }
  function deleteProject(name) {
    setTxns((prev) => prev.map((t) => (t.project === name ? { ...t, project: undefined } : t)));
    setProjectsMeta((prev) => prev.filter((m) => m.name !== name));
    setProjectSheet(null);
  }
  async function syncSheet(url) {
    const u = (url || settings.sheetUrl || "").trim();
    if (!u) return { ok: false, error: "Pegá primero el link CSV de tu Google Sheet." };
    const res = await fetch(u);
    if (!res.ok) throw new Error("No se pudo leer el Sheet (código " + res.status + ").");
    const text = await res.text();
    const rows = parseDivisasCSV(text);
    // Protección: si el CSV llega vacío pero ya teníamos operaciones del Sheet,
    // lo más probable es un fallo de descarga/parseo — no borrar nada.
    setDivisas((prev) => {
      if (!rows.length && prev.some((d) => d.source === "sheet")) return prev;
      return mergeSheetOps(prev, rows);
    });
    return { ok: true, count: rows.length };
  }

  if (!loaded)
    return (
      <div style={{ ...shell, alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: T.mut, fontFamily: FONT }}>Cargando…</div>
      </div>
    );

  if (CLOUD && session && !loaded) {
    return <Splash msg="Cargando datos de la nube…" />;
  }

  return (
    <div style={desktop ? shellDesktop : shell}>
      <style>{css}</style>

      {desktop && (
        <aside style={sidebar}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 8px 16px" }}>
            <span style={{ width: 34, height: 34, borderRadius: 9, background: T.goldSoft, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <IconChart color={T.gold} />
            </span>
            <span style={{ fontSize: 18, fontWeight: 700, color: T.text }}>Patrimonio</span>
            <span style={{ marginLeft: "auto", fontSize: 10, color: T.mut, fontFamily: MONO, opacity: 0.75 }}>{BUILD.split(" · ")[0]}</span>
          </div>
          {NAV.map(([id, label, short, Icon]) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              style={{
                display: "flex", alignItems: "center", gap: 12,
                background: tab === id ? T.goldSoft : "transparent",
                border: "none", borderRadius: 11, padding: "12px 14px",
                cursor: "pointer", width: "100%", textAlign: "left",
                color: tab === id ? T.gold : T.mut, fontSize: 15, fontWeight: 600, fontFamily: FONT,
              }}
            >
              <Icon color={tab === id ? T.gold : T.mut} />
              {label}
            </button>
          ))}
        </aside>
      )}

      <div style={desktop ? contentCol : contentColMobile}>
      {/* Header */}
      <header
        style={{
          padding: "18px 20px 12px",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
        }}
      >
        <div>
          {!desktop && (
            <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: -0.3, color: T.text, display: "flex", alignItems: "baseline", gap: 8 }}>
              Patrimonio
              <span style={{ fontSize: 10, fontWeight: 600, color: T.mut, fontFamily: MONO, opacity: 0.75 }}>{BUILD.split(" · ")[0]}</span>
            </div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <StatusDot status={priceStatus} lastUpdate={lastUpdate} source={source} />
            {CLOUD && session && (
              <button
                onClick={() => setRefreshTick((t) => t + 1)}
                disabled={!loaded}
                aria-label="Actualizar datos"
                title="Actualizar datos"
                style={{ background: "transparent", border: `1px solid ${T.line}`, borderRadius: 8, color: loaded ? T.mut : T.mut2, width: 26, height: 26, display: "inline-flex", alignItems: "center", justifyContent: "center", cursor: loaded ? "pointer" : "default", padding: 0 }}
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
              </button>
            )}
          </div>
        </div>
        <select
          value={cur}
          onChange={(e) => setSettings((s) => ({ ...s, currency: e.target.value }))}
          style={{
            background: T.card,
            color: T.text,

            borderRadius: 10,
            padding: "8px 10px",
            fontSize: 13,

            appearance: "none",
          }}
        >
          {CURRENCIES.map((c) => (
            <option key={c.code} value={c.code}>
              {c.label}
            </option>
          ))}
        </select>
      </header>

      <main style={desktop ? mainDesktop : mainMobile}>
        <div style={desktop ? { maxWidth: 860, margin: "0 auto" } : undefined}>
        {syncErr && (
          <div style={{ background: T.redSoft, border: `1px solid ${T.red}`, borderRadius: 12, padding: "10px 14px", marginBottom: 14, fontSize: 12.5, color: T.red, display: "flex", justifyContent: "space-between", gap: 10, alignItems: "flex-start", lineHeight: 1.5 }}>
            <span>{syncErr}</span>
            <button onClick={() => setSyncErr("")} style={{ ...btnGhost, color: T.red, fontSize: 16, lineHeight: 1, flexShrink: 0 }} aria-label="Cerrar">×</button>
          </div>

        {readOnly && (
          <div style={{ background: T.card2, border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 14px", marginBottom: 14, fontSize: 12.5, color: T.mut }}>
            Modo <b>solo consulta</b>: podés ver todo, pero no modificar. Pedile a un editor que cambie tu rol.
          </div>

        {tab === "balance" && (
          <BalanceTab totals={totals} cur={cur} prices={prices} />

        {tab === "accounts" && (
          <AccountsTab
            accounts={accountsView}

            canEdit={canEditAll}
            onAdd={(type) =>
              type === "crypto"
                ? setCryptoSheet(true)
                : setAcctSheet({ type, mode: "new" })

        {tab === "txns" && (
          <div style={{ paddingTop: 8 }}>
            <div style={{ display: "flex", background: T.card, borderRadius: 12, padding: 4, marginBottom: 4, border: `1px solid ${T.lineSoft}` }}>
              {[["mov", "Movimientos"], ["cierre", "Cierre diario"], ["proj", "Proyectos"]].map(([v, label]) => (
                <button
                  key={v}
                  onClick={() => setTxnView(v)}
                  style={{ flex: 1, border: "none", borderRadius: 9, padding: "10px", fontSize: 14.5, fontWeight: 600, fontFamily: FONT, cursor: "pointer", background: txnView === v ? T.gold : "transparent", color: txnView === v ? "#0A0F1E" : T.mut }}
                >

            </div>
            {txnView === "mov" ? (
              <TxnsTab

                accounts={accountsView}
                cur={cur}
                canWrite={canWriteData}
                onAdd={() => setTxnSheet(true)}
                onEdit={(t) => setTxnSheet(t)}
                onDelete={deleteTxn}
                onBulkImport={bulkImportTxns}
                onImportStatement={() => setStmtSheet(true)}

            ) : txnView === "cierre" ? (

              <ProjectsTab

              />
            )}
          </div>
        )}
        {tab === "crypto" && (
          <CryptoTab
            accounts={accounts}
            prices={prices}
            cur={cur}
            canEdit={canEditAll}
            onAdd={() => setCryptoSheet(true)}
            onEdit={(a) => setCryptoSheet(a)}
          />
        )}
        {tab === "divisas" && (
          <div style={{ paddingTop: 8 }}>
            <div style={{ display: "flex", background: T.card, borderRadius: 12, padding: 4, marginBottom: 4, border: `1px solid ${T.lineSoft}` }}>
              {[["ops", "Operaciones"], ["cxc", "Por cobrar"]].map(([v, label]) => (
                <button
                  key={v}
                  onClick={() => setDivView(v)}
                  style={{ flex: 1, border: "none", borderRadius: 9, padding: "10px", fontSize: 14.5, fontWeight: 600, fontFamily: FONT, cursor: "pointer", background: divView === v ? T.gold : "transparent", color: divView === v ? "#0A0F1E" : T.mut }}
                >
                  {label}
                </button>
              ))}
            </div>
            {divView === "ops" ? (
              <DivisasTab
                canWrite={canWriteData}

/* ─────────────────────────────  Autenticación / Roles  ───────────────────────────── */
function App() {
  const [session, setSession] = useState(null);
  const [role, setRole] = useState(null);
  const [checking, setChecking] = useState(CLOUD);
  const [authErr, setAuthErr] = useState("");

  useEffect(() => {
    if (!CLOUD) return;
    let alive = true, sub = null;
    (async () => {
      try {
        const sb = await getSB();
        const { data } = await sb.auth.getSession();
        if (!alive) return;
        setSession(data.session || null);
        setChecking(false);
        sub = sb.auth.onAuthStateChange((_e, s) => { setSession(s || null); }).data.subscription;
      } catch (e) {
        if (alive) { setAuthErr(e.message || "No se pudo conectar."); setChecking(false); }
      }
    })();
    return () => { alive = false; if (sub) sub.unsubscribe(); };
  }, []);

  // Rol del usuario (viene del servidor; la app solo lo refleja)
  useEffect(() => {
    if (!CLOUD || !session) { setRole(null); return; }
    let alive = true;
    (async () => {
      const sb = await getSB();
      const { data } = await sb.from("profiles").select("role").eq("id", session.user.id).maybeSingle();
      if (alive) setRole((data && data.role) || "viewer");
    })();
    return () => { alive = false; };
  }, [session && session.user && session.user.id]);

  async function signOut() {
    const sb = await getSB();
    await sb.auth.signOut();
    setSession(null);
  }

  if (!CLOUD) return <AppMain session={null} role={null} signOut={null} />;
  if (checking) return <Splash msg="Conectando…" />;
  if (authErr) return <Splash msg={authErr} />;
  if (!session) return <LoginScreen onDone={setSession} />;
  if (!role) return <Splash msg="Cargando permisos…" />;
  return <AppMain session={session} role={role} signOut={signOut} />;
}

function Splash({ msg }) {
  return (

  );
}

function LoginScreen({ onDone }) {
  const [mode, setMode] = useState("in"); // in | up
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  async function submit() {
    setBusy(true); setMsg("");
    try {
      const sb = await getSB();
      if (mode === "up") {
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pass });
        if (error) throw error;
        if (data.session) onDone(data.session);
        else setMsg("Cuenta creada. Revisá tu email para confirmarla y después iniciá sesión.");
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
        if (error) throw error;
        onDone(data.session);
      }
    } catch (e) {
      setMsg(e.message || "No se pudo completar la operación.");
    } finally { setBusy(false); }
  }

  return (
    <div style={{ ...shell, justifyContent: "center", padding: "0 24px" }}>
      <style>{css}</style>
      <div style={{ marginBottom: 28, textAlign: "center" }}>
        <div style={{ width: 60, height: 60, borderRadius: 16, background: T.goldSoft, display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
          <IconChart color={T.gold} />
        </div>
        <div style={{ fontSize: 24, fontWeight: 700, color: T.text, letterSpacing: -0.4 }}>Patrimonio</div>
        <div style={{ fontSize: 13.5, color: T.mut, marginTop: 4 }}>
          {mode === "in" ? "Iniciá sesión para continuar" : "Creá tu cuenta"}
        </div>
      </div>
      <Field label="Email">
        <input style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} type="email" autoCapitalize="none" autoCorrect="off" placeholder="tu@email.com" />
      </Field>
      <Field label="Contraseña">
        <input style={inputStyle} value={pass} onChange={(e) => setPass(e.target.value)} type="password" placeholder="••••••••" />
      </Field>
      <PrimaryBtn color={T.gold} disabled={busy || !email.trim() || pass.length < 6} onClick={submit}>
        {busy ? "…" : mode === "in" ? "Entrar" : "Crear cuenta"}
      </PrimaryBtn>
      <button onClick={() => { setMode(mode === "in" ? "up" : "in"); setMsg(""); }} style={{ ...btnGhost, width: "100%", marginTop: 14, color: T.mut }}>
        {mode === "in" ? "No tengo cuenta — registrarme" : "Ya tengo cuenta — iniciar sesión"}
      </button>
      {msg && <div style={{ fontSize: 13, color: T.mut, marginTop: 14, textAlign: "center", lineHeight: 1.5 }}>{msg}</div>}
      <div style={{ fontSize: 11.5, color: T.mut2, marginTop: 26, textAlign: "center", lineHeight: 1.6 }}>
        Las cuentas nuevas entran como <b>Consulta</b>. Un editor puede cambiar tu rol desde Ajustes.
      </div>
    </div>
  );
}

function UsersPanel({ session, role, signOut }) {
  const [users, setUsers] = useState([]);

  async function load() {
    if (role !== "editor") return;
    const sb = await getSB();
    const { data, error } = await sb.from("profiles").select("id,email,role").order("email");
    if (!error) setUsers(data || []);
  }
  useEffect(() => { load(); }, [role]);

  async function changeRole(id, newRole) {
    setBusy(true); setMsg("");
    try {

      const { error } = await sb.from("profiles").update({ role: newRole }).eq("id", id);
      if (error) throw error;
      setUsers((u) => u.map((x) => (x.id === id ? { ...x, role: newRole } : x)));
      setMsg("Rol actualizado.");

    finally { setBusy(false); }

  return (
