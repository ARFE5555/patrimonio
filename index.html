    const a = allocateFIFO(vs, others);
    let remaining = W;
    const rows = [];
    for (const vid of manualAllocs) {
      const v = vs.find((x) => x.id === vid);
      if (!v) continue;
      const restante = Math.max(0, capOf(v) - ((a.ventaStats[v.id] || {}).vesUsados || 0));
      const take = W > 0 ? Math.min(restante, remaining) : 0;
      rows.push({ v, ves: take, usd: W > 0 ? gross * (take / W) : 0 });
      remaining -= take;
    }
    return { rows, autoUsd: W > 0 ? gross * (Math.max(0, remaining) / W) : 0 };
  })();

  return (
    <Sheet open={!!state} onClose={onClose} title={(editing ? "Editar " : "") + (venta ? "Venta de USD" : "Compra de USD")}>
      <Field label="Monto USD">
        <input style={{ ...inputStyle, fontFamily: MONO, fontSize: 22 }} value={usd} onChange={(e) => setUsd(e.target.value)} inputMode="decimal" placeholder="0.00" autoFocus />
      </Field>
      <Field label="Tasa (VES por USD)">
        <input style={{ ...inputStyle, fontFamily: MONO }} value={tasa} onChange={(e) => setTasa(e.target.value)} inputMode="decimal" placeholder="0.00" />
      </Field>
      <Field label="VES totales">
        <input style={readonly} value={fmtBs(ves)} readOnly />
      </Field>

      {venta ? (
        <>
          <Field label="Persona a quien le vendimos">
            <input style={inputStyle} value={persona} onChange={(e) => setPersona(e.target.value)} placeholder="Nombre" />
          </Field>
          <Field label="Comisión (opcional)">
            <select style={{ ...inputStyle, appearance: "none" }} value={comMode} onChange={(e) => { setComAuto(false); setComMode(e.target.value); }}>
              <option value="none">Sin comisión</option>
              <option value="ves">Monto en VES</option>
              <option value="usd">Monto en USD</option>
            </select>
          </Field>
          {comMode === "ves" && (
            <Field label="Comisión en VES">
              <input style={{ ...inputStyle, fontFamily: MONO }} value={comVes} onChange={(e) => setComVes(e.target.value)} inputMode="decimal" placeholder="0,00" />
            </Field>
          )}
          {comMode === "usd" && (
            <Field label="Comisión en USD">
              <input style={{ ...inputStyle, fontFamily: MONO }} value={comUsd} onChange={(e) => { setComAuto(false); setComUsd(e.target.value); }} inputMode="decimal" placeholder="0.00" />
            </Field>
          )}
          {comMode !== "none" && (
            <div style={{ fontSize: 12.5, color: T.mut, margin: "-4px 2px 12px" }}>
              {comMode === "usd"
                ? <>Comisión: <span style={{ color: T.text, fontFamily: MONO }}>{fmtUsd(comUsdAmt)}</span> (se descuenta de la ganancia)</>
                : <>Comisión: <span style={{ color: T.text, fontFamily: MONO }}>{fmtBs(comVesAmt)}</span> (reduce los VES disponibles)</>}
            </div>
          )}
        </>
      ) : (
        <>
          <Field label="Cliente a quien le compramos">
            <input style={inputStyle} value={persona} onChange={(e) => setPersona(e.target.value)} placeholder="Nombre" />
          </Field>
          <Field label="Comisión">
            <select style={{ ...inputStyle, appearance: "none" }} value={comMode} onChange={(e) => { setComAuto(false); setComMode(e.target.value); }}>
              <option value="pct">Banco (0% / 0,3%)</option>
              <option value="ves">Monto en VES</option>
              <option value="usd">Monto en USD</option>
            </select>
          </Field>
          {comMode === "pct" && (
            <Field label="Banco">
              <select style={{ ...inputStyle, appearance: "none" }} value={comisionTipo} onChange={(e) => setComisionTipo(e.target.value)}>
                <option value="mismo">{COMISION_LABEL.mismo}</option>
                <option value="otros">{COMISION_LABEL.otros}</option>
              </select>
            </Field>
          )}
          {comMode === "ves" && (
            <Field label="Comisión en VES">
              <input style={{ ...inputStyle, fontFamily: MONO }} value={comVes} onChange={(e) => setComVes(e.target.value)} inputMode="decimal" placeholder="0,00" />
            </Field>
          )}
          {comMode === "usd" && (
            <Field label="Comisión en USD">
              <input style={{ ...inputStyle, fontFamily: MONO }} value={comUsd} onChange={(e) => { setComAuto(false); setComUsd(e.target.value); }} inputMode="decimal" placeholder="0.00" />
            </Field>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.mut, margin: "-4px 2px 16px" }}>
            {comMode === "usd" ? (
              <>
                <span>Comisión: <span style={{ color: T.text, fontFamily: MONO }}>{fmtUsd(comUsdAmt)}</span></span>
                <span>USDT neto: <span style={{ color: T.text, fontFamily: MONO, fontWeight: 600 }}>{fmtUsd((isNaN(nUsd) ? 0 : nUsd) - comUsdAmt)}</span></span>
              </>
            ) : (
              <>
                <span>Comisión: <span style={{ color: T.text, fontFamily: MONO }}>{fmtBs(comVesAmt)}</span></span>
                <span>Total VES: <span style={{ color: T.text, fontFamily: MONO, fontWeight: 600 }}>{fmtBs(ves + comVesAmt)}</span></span>
              </>
            )}
          </div>
          <Field label="Asignación de los VES">
            <select
              style={{ ...inputStyle, appearance: "none" }}
              value=""
              onChange={(e) => { if (e.target.value) setManualAllocs((m) => [...m, e.target.value]); }}
            >
              <option value="">{manualAllocs.length ? "+ Agregar otra venta al reparto…" : "Automática — o elegí una venta…"}</option>
              {ventasList.filter(({ v }) => !manualAllocs.includes(v.id)).map(({ v, restante }) => (
                <option key={v.id} value={v.id}>
                  {fmtDate(v.date)} · {v.persona || "—"} · queda {fmtBs(restante)}
                </option>
              ))}
            </select>
          </Field>
          {manualAllocs.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              {split.rows.map((r, i) => (
                <div key={r.v.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.bg2, border: `1px solid ${T.lineSoft}`, borderRadius: 10, padding: "9px 11px", marginBottom: 6 }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{i + 1}. {r.v.persona || fmtDate(r.v.date)}</div>
                    <div style={{ fontSize: 11.5, color: T.mut, fontFamily: MONO }}>{fmtDate(r.v.date)} · asigna {fmtUsd(r.usd)}</div>
                  </div>
                  <button onClick={() => setManualAllocs((m) => m.filter((x) => x !== r.v.id))} style={{ ...btnGhost, color: T.mut2, fontSize: 18, lineHeight: 1 }} aria-label="Quitar">×</button>
                </div>
              ))}
              <div style={{ fontSize: 12, color: split.autoUsd > 0.01 ? T.gold : T.mut, marginLeft: 2 }}>
                {split.autoUsd > 0.01 ? `Resto ≈ ${fmtUsd(split.autoUsd)} → se asigna automáticamente` : "Estas ventas cubren toda la compra."}
              </div>
            </div>
          )}
          <div style={{ fontSize: 12, color: T.mut, margin: "0 2px 8px", lineHeight: 1.5 }}>
            Sin elegir nada, se asigna sola a las ventas pendientes por orden de llegada (sin importar la fecha). Podés elegir varias ventas en orden: la compra llena la primera y el excedente pasa a la siguiente.
          </div>
        </>
      )}

      {esBinance && (
        <div style={{ fontSize: 12.5, color: T.gold, margin: "0 2px 12px", lineHeight: 1.5 }}>
          ⚡ Etiqueta <b>Binance</b> detectada: comisión del {String(binancePct).replace(".", ",")}% en USD
          {comAuto && comMode === "usd" ? " aplicada automáticamente." : " (editada a mano)."} El porcentaje se ajusta en Ajustes.
        </div>
      )}
      <Field label="Referencia bancaria (opcional)">
        <input style={inputStyle} value={referencia} onChange={(e) => setReferencia(e.target.value)} placeholder="N° de operación / referencia" autoCapitalize="none" />
      </Field>

      <Field label="Fecha">
        <input type="date" style={{ ...inputStyle, fontFamily: MONO }} value={date} onChange={(e) => setDate(e.target.value)} />
      </Field>

      <PrimaryBtn
        color={venta ? T.green : T.blue}
        disabled={!valid}
        onClick={() =>
          onSave({
            id: state.id,
            kind,
            usd: nUsd,
            tasa: nTasa,
            date,
            persona: persona.trim(),
            referencia: referencia.trim() || undefined,
            manualAllocs: venta ? undefined : (manualAllocs.length ? manualAllocs : undefined),
            ventaId: undefined,
            comMode,
            comisionTipo,
            comisionVesInput: comMode === "ves" ? (numVE(comVes) || 0) : undefined,
            comisionUsdInput: comMode === "usd" ? (numVE(comUsd) || 0) : undefined,
          })
        }
      >
        {editing ? "Guardar cambios" : venta ? "Registrar venta" : "Registrar compra"}
      </PrimaryBtn>
      {editing && (
        <button onClick={() => onDelete(state.id)} style={{ ...btnGhost, color: T.red, width: "100%", marginTop: 14, padding: 10 }}>
          Eliminar operación
        </button>
      )}
    </Sheet>
  );
}

/* ── Conciliación bancaria: lectura de estado de cuenta + Excel con colores ── */
function ensureXLSXStyle() {
  if (window.XLSX && window.XLSX.__styled) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const urls = [
      "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js",
      "https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js",
    ];
    let i = 0;
    (function next() {
      if (i >= urls.length) { rej(new Error("No se pudo cargar el generador de Excel.")); return; }
      const s = document.createElement("script");
      s.src = urls[i++];
      s.onload = () => { if (window.XLSX) { window.XLSX.__styled = true; res(window.XLSX); } else next(); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
}
function wbToBlobUrl(XLSX, wb, name) {
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  return { url: URL.createObjectURL(blob), name };
}
function normRef(s) {
  return String(s || "").replace(/\s+/g, "").replace(/[^0-9a-zA-Z]/g, "").replace(/^0+/, "").toLowerCase();
}
/* ─────────────────────────────  Estado de cuenta bancario  ─────────────────────────────
   Lee el .xlsx que emite el banco y lo convierte en movimientos listos para justificar.
   La REFERENCIA del banco es la clave: sirve de código validador y de anti-duplicado,
   así el mismo estado de cuenta se puede subir dos veces sin duplicar nada. */
/* El ORDEN importa: cada campo se asigna a una columna y esa columna queda
   ocupada. Así "Fecha Valor" no le roba la columna a "Monto", y
   "Descripción de la Operación" no le roba la columna a "Referencia". */
const STMT_FIELDS = ["fecha", "credito", "debito", "desc", "ref", "monto", "saldo"];
const STMT_HINTS = {
  fecha: ["fecha", "f. valor", "fec ", "date"],
  ref: ["referencia", "ref", "comprobante", "operacion", "operación", "nro", "n°", "numero", "número", "documento"],
  desc: ["descripcion", "descripción", "concepto", "detalle", "observacion", "observación", "transaccion", "transacción", "motivo", "beneficiario"],
  credito: ["credito", "crédito", "haber", "abono", "deposito", "depósito", "entrada", "ingreso"],
  debito: ["debito", "débito", "debe", "cargo", "retiro", "salida", "egreso"],
  monto: ["monto", "importe", "valor", "amount"],
  saldo: ["saldo", "balance"],
};

function stmtNorm(s) {
  return String(s == null ? "" : s).toLowerCase().trim();
}

/* Líneas que el banco incluye en la tabla pero que NO son movimientos: el saldo
   con el que abre el período, el de cierre, subtotales. Mercantil abre con
   "SALDO INICIAL" y cierra con "SALDO FINAL"; importarlas sumaría dos veces el
   saldo y el cuadre nunca daría. */
const STMT_NO_MOVIMIENTO = [
  /^saldo\s+(inicial|anterior|final|actual|disponible|al\b)/,
  /^saldo$/,
  /^totales?$/,
  /^total\s+(general|del|de)\b/,
  /^sub\s*total/,
];
function esLineaDeSaldo(desc) {
  const d = stmtNorm(desc).replace(/\s+/g, " ");
  if (!d) return false;
  return STMT_NO_MOVIMIENTO.some((re) => re.test(d));
}

/* Saldo con el que abre el estado de cuenta, si el banco lo trae como línea.
   Sirve para proponerlo como saldo inicial de la cuenta: sin ese número, el
   cuadre diario compara contra un saldo corrido que arranca en cero. */
function detectSaldoInicial(rows, headerIdx, map) {
  return buscarLineaDeSaldo(rows, headerIdx, map, /^saldo\s+(inicial|anterior)/);
}

/* Saldo de cierre del período, si el banco lo trae como línea. Sirve para
   comprobar después de importar que la cuenta quedó donde el banco dice. */
function detectSaldoFinal(rows, headerIdx, map) {
  return buscarLineaDeSaldo(rows, headerIdx, map, /^saldo\s+(final|actual)/);
}

function buscarLineaDeSaldo(rows, headerIdx, map, patron) {
  if (!rows || !map || map.desc < 0) return null;
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row) continue;
    const desc = stmtNorm(row[map.desc]).replace(/\s+/g, " ");
    if (!patron.test(desc)) continue;
    const candidatos = [map.saldo, map.credito, map.monto, map.debito];
    for (const idx of candidatos) {
      if (idx < 0) continue;
      const v = numVE(row[idx]);
      if (!isNaN(v)) return { saldo: v, date: stmtDate(map.fecha >= 0 ? row[map.fecha] : "") || "" };
    }
    return null;
  }
  return null;
}

/* Fecha de estado de cuenta. Devuelve "" si la celda no es una fecha de verdad,
   para que los pies de página ("TOTALES", "SALDO ANTERIOR") no entren como
   movimientos. También entiende el número serial de Excel. */
function stmtDate(v) {
  if (v == null || v === "") return "";
  const raw = String(v).trim();
  // Serial de Excel (días desde 1899-12-30). Rango razonable: 1990-2100.
  if (/^\d{5}(\.\d+)?$/.test(raw)) {
    const n = Number(raw);
    if (n >= 32874 && n <= 73415) {
      const ms = Math.round((n - 25569) * 86400000);
      const d = new Date(ms);
      if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
    }
    return "";
  }
  if (!/\d/.test(raw)) return "";
  const iso = fechaISO(raw);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return "";
  const [y, m, d] = String(iso).split("-").map(Number);
  if (y < 1990 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return "";
  return iso;
}

/* Valores que algunos bancos ponen en la columna de referencia cuando no hay
   una: no identifican nada, así que se tratan como "sin referencia". Si no,
   todas las comisiones del mes parecerían la misma operación. */
const STMT_REF_VACIAS = new Set(["", "0", "00", "000", "na", "n/a", "s/n", "sn", "sinreferencia", "sinref", "ninguna", "null", "none", "-", "--"]);

/* Clave de referencia para IDENTIDAD (no para comparación laxa).
   A diferencia de normRef, conserva los ceros a la izquierda: para el banco
   "000123" y "123" son referencias distintas. */
function stmtRefKey(s) {
  const raw = String(s == null ? "" : s).trim().toLowerCase();
  const limpia = raw.replace(/[^0-9a-z]/g, "");
  if (STMT_REF_VACIAS.has(raw) || STMT_REF_VACIAS.has(limpia)) return "";
  // Solo ceros ("00000000000" en Banesco) no identifica ninguna operación:
  // el banco lo usa para cargos varios, y tratarlo como referencia haría que
  // dos cargos distintos del mismo día por el mismo monto parecieran uno.
  if (/^0+$/.test(limpia)) return "";
  return limpia;
}

/* Lee una tabla HTML. Varios bancos venezolanos —Banesco entre ellos— entregan
   el estado de cuenta como HTML con extensión .xls. Se parsea con el DOM del
   navegador en vez de con la librería de Excel: es exacto con los acentos y no
   depende de que la librería adivine el formato. */
function htmlTableToRows(text) {
  const doc = new DOMParser().parseFromString(text, "text/html");
  const tables = Array.from(doc.querySelectorAll("table"));
  if (!tables.length) return [];
  let best = tables[0];
  tables.forEach((t) => { if (t.rows.length > best.rows.length) best = t; });
  return Array.from(best.rows).map((tr) =>
    Array.from(tr.cells).map((td) => String(td.textContent || "").replace(/ /g, " ").trim())
  );
}

/* ¿El archivo es en realidad HTML disfrazado de .xls? */
function looksLikeHtml(sample) {
  const s = String(sample || "").slice(0, 1024).trim().toLowerCase();
  return s.startsWith("<") || s.indexOf("<table") >= 0 || s.indexOf("<html") >= 0;
}

/* Decodifica respetando los acentos: intenta UTF-8 y, si aparecen caracteres
   de reemplazo, reintenta con windows-1252 (lo que usan algunos bancos). */
function decodeText(buf) {
  let t = "";
  try { t = new TextDecoder("utf-8").decode(buf); } catch (e) { t = ""; }
  if (t && t.indexOf("�") >= 0) {
    try { return new TextDecoder("windows-1252").decode(buf); } catch (e) { /* se queda con utf-8 */ }
  }
  return t;
}

/* Busca la fila de encabezado y propone un mapeo de columnas.
   Devuelve { headerIdx, header, map } — map con índices (o -1) por campo. */
function detectStatementLayout(rows) {
  let best = null;
  const limit = Math.min(rows.length, 40);
  for (let i = 0; i < limit; i++) {
    const cells = (rows[i] || []).map(stmtNorm);
    if (!cells.some((c) => c)) continue;
    const taken = new Set();
    const map = {};
    let score = 0;
    // Tres pasadas por campo: coincidencia exacta, luego por prefijo, luego
    // por contenido. Una columna ya asignada no se vuelve a ofrecer.
    STMT_FIELDS.forEach((field) => {
      const hints = STMT_HINTS[field];
      const find = (test) => cells.findIndex((c, idx) => c && !taken.has(idx) && hints.some((k) => test(c, k)));
      let idx = find((c, k) => c === k);
      if (idx < 0) idx = find((c, k) => c.indexOf(k) === 0);
      if (idx < 0) idx = find((c, k) => c.includes(k));
      map[field] = idx;
      if (idx >= 0) { taken.add(idx); score++; }
    });
    // "saldo" solo no basta: exigimos fecha + (referencia o algún monto)
    const usable = map.fecha >= 0 && (map.ref >= 0 || map.monto >= 0 || map.credito >= 0 || map.debito >= 0);
    if (usable && (!best || score > best.score)) best = { headerIdx: i, header: rows[i] || [], map, score };
  }
  return best;
}

/* Convierte las filas crudas en movimientos usando el mapeo dado.
   signMode: "cols" (débito/crédito separados) | "signed" (un monto con signo)
             | "income" | "expense" (todo del mismo tipo) */
function rowsToStatementOps(rows, headerIdx, map, signMode) {
  const out = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.every((c) => !String(c == null ? "" : c).trim())) continue;
    const at = (idx) => (idx >= 0 ? row[idx] : undefined);
    // Si la celda de fecha no es una fecha válida, la fila no es un movimiento
    // (encabezados repetidos, subtotales, "SALDO ANTERIOR", pies de página).
    const date = stmtDate(at(map.fecha));
    if (!date) continue;
    const ref = String(at(map.ref) == null ? "" : at(map.ref)).trim();
    const desc = String(at(map.desc) == null ? "" : at(map.desc)).trim();
    // "SALDO INICIAL", "SALDO FINAL" y subtotales no son movimientos
    if (esLineaDeSaldo(desc)) continue;

    let amount = NaN;
    let kind = null;
    if (signMode === "cols") {
      const cr = map.credito >= 0 ? numVE(at(map.credito)) : NaN;
      const db = map.debito >= 0 ? numVE(at(map.debito)) : NaN;
      const crOk = !isNaN(cr) && Math.abs(cr) > 0;
      const dbOk = !isNaN(db) && Math.abs(db) > 0;
      if (crOk) { amount = Math.abs(cr); kind = "income"; }
      else if (dbOk) { amount = Math.abs(db); kind = "expense"; }
    } else {
      const raw = map.monto >= 0 ? numVE(at(map.monto)) : NaN;
      if (!isNaN(raw)) {
        amount = Math.abs(raw);
        if (signMode === "signed") kind = raw < 0 ? "expense" : "income";
        else kind = signMode === "income" ? "income" : "expense";
      }
    }
    if (isNaN(amount) || !(amount > 0) || !kind) continue;

    // Saldo acumulado que trae el banco en esa línea. Es la clave del cuadre
    // diario: permite comparar el saldo del banco contra el de la app sin que
    // nadie tenga que sumar a mano.
    const bankBalance = map.saldo >= 0 ? numVE(at(map.saldo)) : NaN;

    out.push({
      date, ref, desc, amount, kind,
      refKey: stmtRefKey(ref),
      rowNum: i + 1,
      bankBalance: isNaN(bankBalance) ? undefined : bankBalance,
    });
  }

  /* Hay bancos que listan del movimiento más nuevo al más viejo (Mercantil
     personas lo hace). Se normaliza a orden cronológico y se renumeran las
     filas, porque el número de fila se usa para saber cuál es la última línea
     de un día —el saldo que vale— y para ordenar el cierre diario. */
  if (out.length > 1 && out[0].date > out[out.length - 1].date) {
    out.reverse();
    out.forEach((op, k) => { op.rowNum = k + 1; });
  }
  return out;
}

/* Proporción máxima que puede representar una comisión respecto del movimiento
   que la genera. Banesco cobra 0,3% y 1,5%; el tope holgado deja pasar esas y
   corta los falsos positivos. */
const STMT_MAX_COM_RATIO = 0.25;

/* En el estado de cuenta, cuando una referencia aparece más de una vez, las
   líneas extra suelen ser la COMISIÓN de esa misma transferencia — no
   movimientos aparte. Se unen: la línea de mayor monto es el movimiento y el
   resto se suma como comisión.

   Pero la referencia repetida NO siempre significa comisión. Banesco usa
   referencias correlativas de lote ("00000000003") para agrupar liquidaciones
   de punto de venta: tres depósitos grandes y positivos que comparten
   referencia y fecha, y que fusionar destrozaría el saldo. Por eso se exige
   que cada línea accesoria sea:

     · un DÉBITO (una comisión siempre cobra, nunca abona), y
     · pequeña frente al movimiento (≤ 25% del principal).

   Si alguna línea del grupo no cumple, el grupo NO se fusiona y cada línea
   entra como movimiento aparte. Verificado contra un estado de cuenta real de
   499 líneas: el saldo reconstruido coincide al céntimo con el del banco.

   La comisión siempre se RESTA del saldo (ver acctBalance), tanto en ingresos
   como en egresos, que es justo lo que hace el banco. */
function mergeStatementCommissions(ops) {
  // Se agrupa por referencia Y fecha: la comisión siempre cae el mismo día que
  // su transferencia. Sin la fecha, tres comisiones mensuales que compartan una
  // referencia genérica se fusionarían como si fueran una sola operación.
  const groupKey = (op) => (op.refKey ? `${op.refKey}|${op.date}` : "");
  const groups = new Map();
  ops.forEach((op) => {
    const k = groupKey(op);
    if (!k) return;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(op);
  });

  const consumed = new Set();
  const merged = [];
  ops.forEach((op) => {
    if (consumed.has(op)) return;
    const gk = groupKey(op);
    const g = gk ? groups.get(gk) : null;
    if (!g || g.length < 2) { merged.push(op); return; }
    // El movimiento es el de mayor monto; las demás líneas son candidatas a comisión.
    let principal = g[0];
    g.forEach((x) => { if (x.amount > principal.amount) principal = x; });
    const fees = g.filter((x) => x !== principal);

    // Toda línea accesoria debe ser un débito y pequeña frente al principal.
    const sonComisiones = fees.every(
      (x) => x.kind === "expense" && x.amount <= principal.amount * STMT_MAX_COM_RATIO
    );
    if (!sonComisiones) {
      // Grupo de lote o dos cargos distintos: cada línea va por su cuenta.
      merged.push({ ...op, refCompartida: true });
      return;
    }

    g.forEach((x) => consumed.add(x));
    // El saldo del banco que vale es el de la ÚLTIMA línea del grupo: el que
    // queda después de cobrar también la comisión.
    let ultima = g[0];
    g.forEach((x) => { if ((x.rowNum || 0) > (ultima.rowNum || 0)) ultima = x; });
    merged.push({
      ...principal,
      commission: fees.reduce((s, x) => s + (x.amount || 0), 0),
      comLines: fees.length,
      bankBalance: ultima.bankBalance,
      rowNum: ultima.rowNum,
    });
  });
  return merged;
}

/* Clave de identidad de un movimiento bancario dentro de una cuenta.
   SIEMPRE incluye fecha y monto, incluso cuando hay referencia: hay bancos que
   repiten la referencia (o ponen "N/A") en varias líneas, y si la clave fuera
   solo la referencia esos movimientos se descartarían como falsos duplicados.
   Sin referencia se completa con la descripción. */
function stmtKeyOf(accountId, op) {
  const cents = Math.round((op.amount || 0) * 100);
  const rk = op.refKey || stmtRefKey(op.ref);
  if (rk) return `${accountId}|r|${rk}|${op.date}|${cents}`;
  return `${accountId}|h|${op.date}|${cents}|${stmtNorm(op.desc).replace(/\s+/g, " ").slice(0, 40)}`;
}

/* Índice de lo ya registrado, para no duplicar al reimportar el mismo estado.
   Se cuenta CUÁNTAS veces existe cada clave, no si existe: un comercio puede
   cobrar dos veces el mismo monto el mismo día y ambas son operaciones reales.
   Si el archivo trae 2 y en la app hay 1, se importa solo la que falta. */
function buildTxnIndex(txns) {
  const m = new Map();
  (txns || []).forEach((t) => {
    if (!t || !t.accountId) return;
    // Se recalcula la clave desde t.ref (no se confía en refKey guardado) para
    // que todo el índice use siempre la misma regla de normalización.
    const k = stmtKeyOf(t.accountId, { ref: t.ref, date: t.date, amount: t.amount, desc: t.bankDesc || t.motivo });
    m.set(k, (m.get(k) || 0) + 1);
  });
  return m;
}

function parseBankRows(rows) {
  const norm = (s) => String(s || "").toLowerCase().trim();
  let hi = -1, cols = null;
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const r = (rows[i] || []).map(norm);
    const fFecha = r.findIndex((c) => c.includes("fecha"));
    const fRef = r.findIndex((c) => c.includes("refer") || c.includes("comprob") || c.includes("operac") || c.includes("nro") || c.includes("número") || c.includes("numero"));
    const fMonto = r.findIndex((c) => c.includes("monto") || c.includes("importe") || c.includes("valor") || c.includes("crédito") || c.includes("credito") || c.includes("débito") || c.includes("debito") || c === "bs" || c.includes("monto bs"));
    if (fFecha >= 0 && (fRef >= 0 || fMonto >= 0)) {
      cols = {
        fFecha, fRef, fMonto,
        fCred: r.findIndex((c) => c.includes("crédito") || c.includes("credito") || c.includes("haber") || c.includes("abono")),
        fDeb: r.findIndex((c) => c.includes("débito") || c.includes("debito") || c.includes("debe") || c.includes("cargo")),
      };
      hi = i; break;
    }
  }
  if (hi < 0) return [];
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i]; if (!row) continue;
    const fecha = fechaISO(row[cols.fFecha]);
    const ref = cols.fRef >= 0 ? String(row[cols.fRef] || "").trim() : "";
    let monto = cols.fMonto >= 0 ? numVE(row[cols.fMonto]) : NaN;
    if (isNaN(monto) && cols.fCred >= 0) monto = numVE(row[cols.fCred]);
    if (isNaN(monto) && cols.fDeb >= 0) monto = numVE(row[cols.fDeb]);
    if (!ref && isNaN(monto)) continue;
    out.push({ fecha, ref, monto: isNaN(monto) ? null : Math.abs(monto), refKey: normRef(ref) });
  }
  return out;
}

/* ─────────────────────────────  Tab: Conciliación  ───────────────────────────── */
function ConciliacionTab({ divisas }) {
  const pad = (n) => String(n).padStart(2, "0");
  const monthStart = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`;
  const round2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
  const [from, setFrom] = useState(monthStart());
  const [to, setTo] = useState(todayISO());
  const [bankRows, setBankRows] = useState(null);
  const [files, setFiles] = useState([]);
  const [bankMsg, setBankMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [dl, setDl] = useState(null);

  const ops = (divisas || []).filter((d) => (d.kind === "venta" || d.kind === "compra") && d.date >= from && d.date <= to);
  const result = useMemo(() => {
    if (!bankRows) return null;
    const byRef = {};
    bankRows.forEach((b) => { if (b.refKey) byRef[b.refKey] = b; });
    return ops.map((o) => {
      const monto = (o.usd || 0) * (o.tasa || 0);
      const tipo = o.kind === "venta" ? "Ingreso" : "Egreso";
      const rk = normRef(o.referencia || "");
      let estado = "No encontrado", banco = null;
      if (rk && byRef[rk]) { estado = "Validado"; banco = byRef[rk]; }
      else {
        const cand = bankRows.find((b) => b.fecha === o.date && b.monto != null && Math.abs(b.monto - monto) <= Math.max(1, monto * 0.01));
        if (cand) { estado = "Validado (monto/fecha)"; banco = cand; }
      }
      return { fecha: o.date, tipo, referencia: o.referencia || "", monto, estado, banco };
    });
  }, [bankRows, from, to, divisas]);

  const okCount = result ? result.filter((r) => r.estado.indexOf("Validado") === 0).length : 0;
  const noCount = result ? result.length - okCount : 0;
  const total = result ? result.length : 0;
  const completo = !!result && total > 0 && noCount === 0;

  async function onBankFiles(e) {
    const fs = Array.from(e.target.files || []);
    e.target.value = "";
    if (!fs.length) return;
    setBusy(true); setBankMsg("Leyendo estado(s) de cuenta…");
    try {
      const XLSX = await ensureXLSXStyle();
      let added = [];
      const newFiles = [];
      for (const f of fs) {
        try {
          const buf = await f.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
          const parsed = parseBankRows(rows);
          added = added.concat(parsed);
          newFiles.push({ name: f.name, count: parsed.length });
        } catch { newFiles.push({ name: f.name, count: 0 }); }
      }
      setBankRows((prev) => [...(prev || []), ...added]);
      setFiles((prev) => [...prev, ...newFiles]);
      setBankMsg(added.length ? `${added.length} movimientos agregados.` : "No se identificaron columnas en el/los archivo(s). Revisá los encabezados.");
    } catch (ex) { setBankMsg((ex && ex.message) || "No se pudo leer el archivo."); }
    finally { setBusy(false); }
  }
  function clearAll() { setBankRows(null); setFiles([]); setBankMsg(""); setDl(null); }

  async function download() {
    if (!result) return;
    setBusy(true);
    try {
      const XLSX = await ensureXLSXStyle();
      const header = ["Fecha", "Tipo (Ingreso/Egreso)", "Referencia", "Monto (Bs)", "Estado", "Banco fecha", "Banco monto (Bs)"];
      const aoa = [header, ...result.map((r) => [r.fecha, r.tipo, r.referencia, round2(r.monto), r.estado, r.banco ? r.banco.fecha : "", r.banco && r.banco.monto != null ? round2(r.banco.monto) : ""])];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [{ wch: 12 }, { wch: 20 }, { wch: 24 }, { wch: 16 }, { wch: 20 }, { wch: 12 }, { wch: 16 }];
      const green = { fill: { patternType: "solid", fgColor: { rgb: "C6EFCE" } } };
      const yellow = { fill: { patternType: "solid", fgColor: { rgb: "FFEB9C" } } };
      const head = { font: { bold: true }, fill: { patternType: "solid", fgColor: { rgb: "D9E1F2" } } };
      for (let c = 0; c < header.length; c++) {
        const ref = XLSX.utils.encode_cell({ r: 0, c });
        if (ws[ref]) ws[ref].s = head;
      }
      result.forEach((r, idx) => {
        const style = r.estado.indexOf("Validado") === 0 ? green : yellow;
        for (let c = 0; c < header.length; c++) {
          const ref = XLSX.utils.encode_cell({ r: idx + 1, c });
          if (!ws[ref]) ws[ref] = { t: "s", v: "" };
          ws[ref].s = style;
        }
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Conciliación");
      if (dl && dl.url) URL.revokeObjectURL(dl.url);
      setDl(wbToBlobUrl(XLSX, wb, `conciliacion_${from}_a_${to}.xlsx`));
    } catch (ex) { setBankMsg((ex && ex.message) || "No se pudo generar el Excel."); }
    finally { setBusy(false); }
  }

  return (
    <div style={{ paddingTop: 8 }}>
      <div style={{ ...sectionTitle, marginBottom: 10 }}>Conciliación bancaria</div>
      <div style={{ fontSize: 12.5, color: T.mut, marginBottom: 16, marginLeft: 2, lineHeight: 1.5 }}>
        Subí el estado de cuenta del banco (Excel) y validá tus operaciones de divisas por fecha, monto y referencia.
        El Excel de salida marca en verde lo validado y en amarillo lo que no se encontró.
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <div style={{ flex: 1 }}>
          <label style={labelStyle}>Desde</label>
          <input type="date" style={{ ...inputStyle, fontFamily: MONO }} value={from} onChange={(e) => setFrom(e.target.value)} />
        </div>
        <div style={{ flex: 1 }}>
          <label style={labelStyle}>Hasta</label>
          <input type="date" style={{ ...inputStyle, fontFamily: MONO }} value={to} onChange={(e) => setTo(e.target.value)} />
        </div>
      </div>

      {files.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          {files.map((f, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: T.mut, padding: "4px 2px" }}>
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</span>
              <span style={{ color: f.count ? T.mut : T.red, flexShrink: 0, marginLeft: 8 }}>{f.count ? `${f.count} mov.` : "sin datos"}</span>
            </div>
          ))}
          <button onClick={clearAll} style={{ ...btnGhost, color: T.red, padding: "6px 2px" }}>Quitar todos</button>
        </div>
      )}

      <label style={{ display: "block", textAlign: "center", background: T.goldSoft, color: T.gold, border: `1px solid ${T.gold}`, borderRadius: 12, padding: "13px", fontSize: 15, fontWeight: 600, cursor: "pointer", marginBottom: 10 }}>
        {busy ? "Procesando…" : files.length ? "Agregar otro estado de cuenta" : "Subir estado(s) de cuenta (Excel)"}
        <input type="file" accept=".xlsx,.xls,.csv" multiple style={{ display: "none" }} onChange={onBankFiles} />
      </label>
      {bankMsg && <div style={{ fontSize: 13, color: T.mut, marginBottom: 14, marginLeft: 2, lineHeight: 1.5 }}>{bankMsg}</div>}

      {bankRows && (
        ops.length === 0 ? (
          <div style={{ ...emptyRow, marginTop: 6 }}>No hay operaciones de divisas en el rango elegido.</div>
        ) : (
          <>
            <div
              style={{
                marginTop: 6, marginBottom: 16, borderRadius: 16, padding: "24px 18px", textAlign: "center",
                background: completo ? T.greenSoft : "rgba(227,178,77,0.14)",
                border: `1px solid ${completo ? T.green : T.gold}`,
              }}
            >
              <div style={{ fontSize: 23, fontWeight: 700, color: completo ? T.green : T.gold, letterSpacing: -0.3 }}>
                {completo ? "Conciliado completo" : "Revisar"}
              </div>
              <div style={{ fontSize: 13, color: T.mut, marginTop: 6 }}>
                {completo
                  ? `Las ${total} operaciones coinciden con el estado de cuenta.`
                  : `${noCount} de ${total} operaciones sin confirmar.`}
              </div>
            </div>
            <PrimaryBtn color={T.blue} disabled={busy} onClick={download}>
              {busy ? "Generando…" : "Generar Excel de conciliación"}
            </PrimaryBtn>
            {dl && (
              <a href={dl.url} download={dl.name} style={{ display: "block", textAlign: "center", background: T.green, color: "#0A0F1E", borderRadius: 12, padding: "13px", fontWeight: 600, textDecoration: "none", marginTop: 10 }}>
                Abrir / guardar el archivo
              </a>
            )}
          </>
        )
      )}
    </div>
  );
}

/* ─────────────────────────────  Tab: Proyectos  ───────────────────────────── */
const PROJECT_COLORS = ["#E3B24D", "#5B8DEF", "#3FCB8B", "#F0645F", "#9B7BEA", "#4DB6AC", "#EC87C0", "#8A93A7"];
const PROJECT_EMOJIS = ["📁", "🏠", "🏢", "🚗", "🛒", "💼", "🍽️", "✈️", "🏗️", "💡", "📦", "🎯"];

function ProjectsTab({ txns, projectsMeta, cur, onAdd, onEdit, canEdit = true, prestamos = [], setPrestamos, canLoan = false, prestamosListos = true }) {
  const metaFor = (name) => projectsMeta.find((m) => m.name === name) || { name, color: "#8A93A7", emoji: "📁" };
  const names = Array.from(new Set([...projectsMeta.map((m) => m.name), ...txns.map((t) => t.project).filter(Boolean)])).sort();

  /* ── Préstamos entre proyectos (registro manual) ── */
  const hoyISO = () => new Date().toISOString().slice(0, 10);
  const [loanSheet, setLoanSheet] = useState(false);
  const [devSheet, setDevSheet] = useState(null);
  const [loanForm, setLoanForm] = useState({});
  const [devForm, setDevForm] = useState({});
  const [verSaldados, setVerSaldados] = useState(false);
  const selStyle = { ...inputStyle, appearance: "none", fontSize: 14, padding: "11px 12px" };
  const saveBtn = { width: "100%", padding: 13, borderRadius: 14, border: "none", background: T.gold, color: "#141414", fontSize: 15, fontWeight: 700, cursor: "pointer", marginTop: 6 };
  const pendienteDe = (p) => Math.max(0, (p.monto || 0) - (p.devoluciones || []).reduce((s, d) => s + (d.monto || 0), 0));
  const activos = (prestamos || []).filter((p) => pendienteDe(p) > 0.005);
  const saldados = (prestamos || []).filter((p) => pendienteDe(p) <= 0.005);

  function guardarPrestamo() {
    const f = loanForm;
    const monto = parseFloat(f.monto);
    if (!f.origen || !f.destino || f.origen === f.destino || !Number.isFinite(monto) || monto <= 0) return;
    setPrestamos((prev) => [...prev, {
      id: uid(), fecha: f.fecha || hoyISO(), origen: f.origen, destino: f.destino,
      monto, currency: f.currency || "usd", nota: (f.nota || "").trim(), devoluciones: [],
    }]);
    setLoanForm({}); setLoanSheet(false);
  }
  function guardarDevolucion() {
    const pr = devSheet; if (!pr) return;
    const monto = parseFloat(devForm.monto);
    if (!Number.isFinite(monto) || monto <= 0) return;
    setPrestamos((prev) => prev.map((x) => x.id === pr.id
      ? { ...x, devoluciones: [...(x.devoluciones || []), { id: uid(), fecha: devForm.fecha || hoyISO(), monto, nota: (devForm.nota || "").trim() }] }
      : x));
    setDevForm({}); setDevSheet(null);
  }
  function borrarPrestamo(id) {
    if (!window.confirm("¿Eliminar este préstamo y sus devoluciones?")) return;
    setPrestamos((prev) => prev.filter((x) => x.id !== id));
  }
  const deudaPorProyecto = (name) => {
    const debe = {}, cobra = {};
    for (const p of activos) {
      const pend = pendienteDe(p), c = p.currency || "usd";
      if (p.destino === name) { const k = p.origen + "|" + c; debe[k] = (debe[k] || 0) + pend; }
      if (p.origen === name) { const k = p.destino + "|" + c; cobra[k] = (cobra[k] || 0) + pend; }
    }
    return { debe: Object.entries(debe), cobra: Object.entries(cobra) };
  };

  const renderPrestamo = (p, saldado) => {
    const pend = pendienteDe(p), c = p.currency || "usd";
    return (
      <div key={p.id} style={{ borderTop: `1px solid ${T.lineSoft}`, paddingTop: 10, marginTop: 10, opacity: saldado ? 0.6 : 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 13.5, fontWeight: 650, color: T.text }}>
              {metaFor(p.destino).emoji || "📁"} {p.destino} <span style={{ color: T.mut, fontWeight: 400 }}>debe a</span> {metaFor(p.origen).emoji || "📁"} {p.origen}
            </div>
            <div style={{ fontSize: 11.5, color: T.mut, marginTop: 2 }}>
              {p.fecha} · préstamo de <span style={{ fontFamily: MONO }}>{money(p.monto, c)}</span>{p.nota ? " · " + p.nota : ""}
            </div>
            {(p.devoluciones || []).length > 0 && (
              <div style={{ fontSize: 11, color: T.mut2, marginTop: 2 }}>
                Devuelto: <span style={{ fontFamily: MONO }}>{money((p.monto || 0) - pend, c)}</span> en {(p.devoluciones || []).length} pago(s)
              </div>
            )}
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontSize: 11, color: T.mut }}>{saldado ? "Saldado" : "Pendiente"}</div>
            <div style={{ fontFamily: MONO, fontSize: 14.5, fontWeight: 700, color: saldado ? T.green : T.red }}>
              {saldado ? "✓" : money(pend, c)}
            </div>
          </div>
        </div>
        {canLoan && !saldado && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={() => { setDevForm({ fecha: hoyISO() }); setDevSheet(p); }} style={{ ...btnGhost, color: T.green, fontSize: 12.5 }}>Registrar devolución</button>
            <button onClick={() => borrarPrestamo(p.id)} style={{ ...btnGhost, color: T.mut2, fontSize: 12.5 }}>Eliminar</button>
          </div>
        )}
        {canLoan && saldado && (
          <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
            <button onClick={() => borrarPrestamo(p.id)} style={{ ...btnGhost, color: T.mut2, fontSize: 12 }}>Eliminar</button>
          </div>
        )}
      </div>
    );
  };

  const summary = (name) => {
    const m = {};
    const meta = metaFor(name);
    const opening = meta.opening || {};
    Object.entries(opening).forEach(([c, v]) => {
      if (v != null && !isNaN(v)) m[c] = { inc: 0, exp: 0, com: 0, open: v };
    });
    txns.filter((t) => (t.project || "") === name).forEach((t) => {
      const c = t.currency || cur;
      const com = t.commission || 0;
      if (!m[c]) m[c] = { inc: 0, exp: 0, com: 0, open: 0 };
      if (t.kind === "income") m[c].inc += (t.amount || 0) - com;
      else m[c].exp += (t.amount || 0) + com;
      m[c].com += com;
    });
    return Object.entries(m);
  };

  return (
    <div style={{ paddingTop: 8 }}>
      {canEdit && (
        <button onClick={onAdd} style={{ ...rowCard, cursor: "pointer", justifyContent: "center", gap: 8, color: T.gold, fontWeight: 600, fontSize: 15, marginBottom: 16 }}>
          <IconPlus color={T.gold} /> Nuevo proyecto
        </button>
      )}

      {/* ── Préstamos entre proyectos ── */}
      <div style={{ ...rowCard, flexDirection: "column", alignItems: "stretch", padding: "14px 15px", marginBottom: 16, borderLeft: `4px solid ${T.gold}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: T.text }}>🤝 Préstamos entre proyectos</div>
          {canLoan && prestamosListos && (
            <button onClick={() => { setLoanForm({ fecha: hoyISO(), currency: "usd" }); setLoanSheet(true); }} style={{ ...btnGhost, color: T.gold, fontWeight: 650 }}>+ Nuevo préstamo</button>
          )}
        </div>
        {!prestamosListos ? (
          <div style={{ fontSize: 12.5, color: T.mut, marginTop: 8 }}>Cargando préstamos…</div>
        ) : activos.length === 0 ? (
          <div style={{ fontSize: 12.5, color: T.mut, marginTop: 8 }}>Sin préstamos pendientes.</div>
        ) : (
          activos.map((p) => renderPrestamo(p, false))
        )}
        {prestamosListos && saldados.length > 0 && (
          <div style={{ marginTop: 10 }}>
            <button onClick={() => setVerSaldados(!verSaldados)} style={{ ...btnGhost, color: T.mut, fontSize: 12 }}>
              {verSaldados ? "Ocultar" : "Ver"} {saldados.length} saldado(s) ✓
            </button>
            {verSaldados && saldados.map((p) => renderPrestamo(p, true))}
          </div>
        )}
      </div>

      {names.length === 0 ? (
        <div style={emptyRow}>Todavía no tenés proyectos. Creá uno y asigná movimientos.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {names.map((name) => {
            const meta = metaFor(name);
            const rows = summary(name);
            const { debe, cobra } = deudaPorProyecto(name);
            return (
              <div key={name} style={{ ...rowCard, flexDirection: "column", alignItems: "stretch", padding: 0, overflow: "hidden", borderLeft: `4px solid ${meta.color}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 15px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
                    <span style={{ width: 40, height: 40, borderRadius: 12, background: meta.color + "22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>
                      {meta.emoji || "📁"}
                    </span>
                    <div style={{ fontSize: 16, fontWeight: 700, color: T.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{name}</div>
                  </div>
                  {canEdit && <button onClick={() => onEdit(name)} style={{ ...btnGhost, color: T.mut, fontSize: 13 }}>Editar</button>}
                </div>
                <div style={{ padding: "0 15px 14px" }}>
                  {rows.length === 0 ? (
                    <div style={{ fontSize: 12.5, color: T.mut }}>Sin movimientos asignados.</div>
                  ) : (
                    rows.map(([c, v]) => (
                      <div key={c} style={{ borderTop: `1px solid ${T.lineSoft}`, paddingTop: 10, marginTop: 10 }}>
                        <div style={{ fontSize: 11.5, color: T.mut2, fontWeight: 600, marginBottom: 6 }}>{c.toUpperCase()}</div>
                        {(v.open || 0) !== 0 && (
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: T.mut, marginBottom: 8 }}>
                            <span>Saldo inicial</span>
                            <span style={{ fontFamily: MONO, color: T.text }}>{money(v.open || 0, c)}</span>
                          </div>
                        )}
                        <div style={{ display: "flex", gap: 10 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 11, color: T.mut }}>Ingresos</div>
                            <div style={{ fontFamily: MONO, fontSize: 13.5, fontWeight: 600, color: T.green }}>{money(v.inc, c)}</div>
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 11, color: T.mut }}>Egresos</div>
                            <div style={{ fontFamily: MONO, fontSize: 13.5, fontWeight: 600, color: T.red }}>{money(v.exp, c)}</div>
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 11, color: T.mut }}>Balance</div>
                            <div style={{ fontFamily: MONO, fontSize: 13.5, fontWeight: 700, color: (v.open || 0) + v.inc - v.exp >= 0 ? T.text : T.red }}>
                              {money((v.open || 0) + v.inc - v.exp, c)}
                            </div>
                          </div>
                        </div>
                        {v.com > 0 && (
                          <div style={{ fontSize: 11, color: T.mut2, marginTop: 6 }}>
                            Comisiones incluidas: <span style={{ fontFamily: MONO }}>{money(v.com, c)}</span>
                          </div>
                        )}
                      </div>
                    ))
                  )}
                  {(debe.length > 0 || cobra.length > 0) && (
                    <div style={{ borderTop: `1px dashed ${T.lineSoft}`, paddingTop: 10, marginTop: 10, display: "flex", flexDirection: "column", gap: 5 }}>
                      {debe.map(([k, v]) => { const parts = k.split("|"); return (
                        <div key={"d" + k} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
                          <span style={{ color: T.red }}>🔻 Debe a {parts[0]} (préstamo)</span>
                          <span style={{ fontFamily: MONO, color: T.red, fontWeight: 650 }}>{money(v, parts[1])}</span>
                        </div>
                      ); })}
                      {cobra.map(([k, v]) => { const parts = k.split("|"); return (
                        <div key={"c" + k} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
                          <span style={{ color: T.green }}>🔸 {parts[0]} le debe (préstamo)</span>
                          <span style={{ fontFamily: MONO, color: T.green, fontWeight: 650 }}>{money(v, parts[1])}</span>
                        </div>
                      ); })}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Sheet: nuevo préstamo */}
      <Sheet open={loanSheet} onClose={() => setLoanSheet(false)} title="Nuevo préstamo entre proyectos">
        <Field label="Fecha">
          <input type="date" value={loanForm.fecha || ""} onChange={(e) => setLoanForm({ ...loanForm, fecha: e.target.value })} style={inputStyle} />
        </Field>
        <Field label="Proyecto que presta">
          <select value={loanForm.origen || ""} onChange={(e) => setLoanForm({ ...loanForm, origen: e.target.value })} style={selStyle}>
            <option value="">— elegir —</option>
            {names.map((n) => <option key={n} value={n}>{n}</option>)}
          </select>
        </Field>
        <Field label="Proyecto que recibe (queda debiendo)">
          <select value={loanForm.destino || ""} onChange={(e) => setLoanForm({ ...loanForm, destino: e.target.value })} style={selStyle}>
            <option value="">— elegir —</option>
            {names.filter((n) => n !== loanForm.origen).map((n) => <option key={n} value={n}>{n}</option>)}
          </select>
        </Field>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 2 }}>
            <Field label="Monto">
              <input type="number" inputMode="decimal" placeholder="0.00" value={loanForm.monto || ""} onChange={(e) => setLoanForm({ ...loanForm, monto: e.target.value })} style={inputStyle} />
            </Field>
          </div>
          <div style={{ flex: 1 }}>
            <Field label="Moneda">
              <select value={loanForm.currency || "usd"} onChange={(e) => setLoanForm({ ...loanForm, currency: e.target.value })} style={selStyle}>
                <option value="usd">USD</option>
                <option value="ves">VES</option>
              </select>
            </Field>
          </div>
        </div>
        <Field label="Nota (opcional)">
          <input placeholder="Motivo del préstamo…" value={loanForm.nota || ""} onChange={(e) => setLoanForm({ ...loanForm, nota: e.target.value })} style={inputStyle} />
        </Field>
        <button
          onClick={guardarPrestamo}
          disabled={!loanForm.origen || !loanForm.destino || loanForm.origen === loanForm.destino || !(parseFloat(loanForm.monto) > 0)}
          style={{ ...saveBtn, opacity: (!loanForm.origen || !loanForm.destino || loanForm.origen === loanForm.destino || !(parseFloat(loanForm.monto) > 0)) ? 0.45 : 1 }}
        >
          Guardar préstamo
        </button>
      </Sheet>

      {/* Sheet: devolución */}
      <Sheet open={!!devSheet} onClose={() => setDevSheet(null)} title="Registrar devolución">
        {devSheet && (
          <div>
            <div style={{ fontSize: 13.5, color: T.mut, marginBottom: 12 }}>
              <b style={{ color: T.text }}>{devSheet.destino}</b> le debe a <b style={{ color: T.text }}>{devSheet.origen}</b>:{" "}
              <span style={{ fontFamily: MONO, color: T.red, fontWeight: 700 }}>{money(pendienteDe(devSheet), devSheet.currency || "usd")}</span> pendiente
            </div>
            <Field label="Fecha">
              <input type="date" value={devForm.fecha || ""} onChange={(e) => setDevForm({ ...devForm, fecha: e.target.value })} style={inputStyle} />
            </Field>
            <Field label="Monto devuelto">
              <input type="number" inputMode="decimal" placeholder="0.00" value={devForm.monto || ""} onChange={(e) => setDevForm({ ...devForm, monto: e.target.value })} style={inputStyle} />
            </Field>
            <Field label="Nota (opcional)">
              <input value={devForm.nota || ""} onChange={(e) => setDevForm({ ...devForm, nota: e.target.value })} style={inputStyle} />
            </Field>
            {parseFloat(devForm.monto) > pendienteDe(devSheet) + 0.005 && (
              <div style={{ fontSize: 12, color: T.gold, marginBottom: 8 }}>⚠ El monto es mayor que lo pendiente; el préstamo quedará saldado.</div>
            )}
            <button
              onClick={guardarDevolucion}
              disabled={!(parseFloat(devForm.monto) > 0)}
              style={{ ...saveBtn, opacity: !(parseFloat(devForm.monto) > 0) ? 0.45 : 1 }}
            >
              Guardar devolución
            </button>
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ─────────────────────────────  Sheet: Proyecto  ───────────────────────────── */
function ProjectSheet({ state, projectsMeta, onClose, onSave, onDelete }) {
  const editing = state && state.name;
  const [name, setName] = useState("");
  const [emoji, setEmoji] = useState("📁");
  const [color, setColor] = useState(PROJECT_COLORS[0]);
  const [openUsd, setOpenUsd] = useState("");
  const [openVes, setOpenVes] = useState("");
  useEffect(() => {
    if (state && state.name) {
      const m = projectsMeta.find((x) => x.name === state.name) || {};
      setName(state.name);
      setEmoji(m.emoji || "📁");
      setColor(m.color || PROJECT_COLORS[0]);
      const ob = m.opening || {};
      setOpenUsd(ob.usd != null ? String(ob.usd) : "");
      setOpenVes(ob.ves != null ? String(ob.ves) : "");
    } else if (state) {
      setName(""); setEmoji("📁"); setColor(PROJECT_COLORS[0]); setOpenUsd(""); setOpenVes("");
    }
  }, [state]);
  if (!state) return null;
  const valid = name.trim();
  const opening = {};
  if (openUsd !== "" && !isNaN(numVE(openUsd))) opening.usd = numVE(openUsd);
  if (openVes !== "" && !isNaN(numVE(openVes))) opening.ves = numVE(openVes);
  return (
    <Sheet open={!!state} onClose={onClose} title={editing ? "Editar proyecto" : "Nuevo proyecto"}>
      <Field label="Nombre">
        <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ej. Local Centro" />
      </Field>
      <Field label="Logo (emoji)">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
          {PROJECT_EMOJIS.map((e) => (
            <button key={e} onClick={() => setEmoji(e)} style={{ width: 42, height: 42, borderRadius: 10, fontSize: 20, cursor: "pointer", background: emoji === e ? T.goldSoft : T.card, border: `1px solid ${emoji === e ? T.gold : T.line}` }}>{e}</button>
          ))}
        </div>
        <input style={{ ...inputStyle, width: 80, textAlign: "center", fontSize: 20 }} value={emoji} onChange={(e) => setEmoji(e.target.value.slice(0, 2))} maxLength={2} />
      </Field>
      <Field label="Color">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          {PROJECT_COLORS.map((c) => (
            <button key={c} onClick={() => setColor(c)} style={{ width: 34, height: 34, borderRadius: 17, background: c, cursor: "pointer", border: color === c ? `3px solid ${T.text}` : `3px solid transparent` }} aria-label={c} />
          ))}
        </div>
      </Field>

      <div style={{ ...sectionTitle, margin: "20px 0 8px" }}>Saldo inicial del proyecto</div>
      <div style={{ fontSize: 12.5, color: T.mut, marginBottom: 12, lineHeight: 1.5 }}>
        Fondos con los que arranca el proyecto, antes de sus movimientos. Se suma al balance.
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <label style={labelStyle}>USD</label>
          <input style={{ ...inputStyle, fontFamily: MONO }} value={openUsd} onChange={(e) => setOpenUsd(e.target.value)} inputMode="decimal" placeholder="0.00" />
        </div>
        <div style={{ flex: 1 }}>
          <label style={labelStyle}>VES (Bs)</label>
          <input style={{ ...inputStyle, fontFamily: MONO }} value={openVes} onChange={(e) => setOpenVes(e.target.value)} inputMode="decimal" placeholder="0,00" />
        </div>
      </div>

      <div style={{ marginTop: 16 }}>
        <PrimaryBtn color={color} disabled={!valid} onClick={() => onSave(editing ? state.name : null, { name: name.trim(), emoji, color, opening })}>
          {editing ? "Guardar cambios" : "Crear proyecto"}
        </PrimaryBtn>
      </div>
      {editing && (
        <button onClick={() => onDelete(state.name)} style={{ ...btnGhost, color: T.red, width: "100%", marginTop: 14, padding: 10 }}>
          Eliminar proyecto (los movimientos quedan sin proyecto)
        </button>
      )}
    </Sheet>
  );
}

<script>
(function () {
  var boot = document.getElementById("bootmsg");
  function setMsg(t) { if (boot) boot.textContent = t; }
  function showError(title, detail) {
    if (window.__mounted) return;
    document.getElementById("root").innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);">' +
      '<div style="max-width:340px;text-align:center;">' +
      '<div style="font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px;">' + title + '</div>' +
      '<div style="font-size:13px;color:#8A97BE;line-height:1.5;margin-bottom:18px;word-break:break-word;">' + (detail || "") + '</div>' +
      '<button onclick="location.reload()" style="background:#E6BE5A;color:#0A0F1E;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600;">Reintentar</button>' +
      '</div></div>';
  }
  window.addEventListener("error", function (e) {
    showError("Se produjo un error", (e && e.message) ? e.message : "Error desconocido");
  });
  function loadScript(urls) {
    return new Promise(function (res, rej) {
      var i = 0;
      (function next() {
        if (i >= urls.length) { rej(new Error("No se pudo cargar " + urls[0])); return; }
        var s = document.createElement("script");
        s.src = urls[i++]; s.crossOrigin = "anonymous";
        s.onload = function () { res(); };
        s.onerror = function () { next(); };
        document.head.appendChild(s);
      })();
    });
  }
  setMsg("cargando librerias (1/3)...");
  loadScript(["https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js", "https://unpkg.com/react@18/umd/react.production.min.js"])
    .then(function () { setMsg("cargando librerias (2/3)..."); return loadScript(["https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js", "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"]); })
    .then(function () { setMsg("cargando compilador (3/3)..."); return loadScript(["https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js", "https://unpkg.com/@babel/standalone@7/babel.min.js"]); })
    .then(function () {
      if (!window.React || !window.ReactDOM) { showError("No se cargo React", "Revisa tu conexion a internet y reintenta."); return; }
      if (!window.Babel) { showError("No se cargo el compilador", "Revisa tu conexion a internet y reintenta."); return; }
      setMsg("iniciando...");
      try {
        var code = document.getElementById("app-src").textContent;
        var out = Babel.transform(code, { presets: ["react"] }).code;
        new Function(out)();
      } catch (err) {
        showError("Error al iniciar la app", (err && err.message) ? err.message : String(err));
      }
    })
    .catch(function (err) {
      showError("No se pudieron cargar las librerias", ((err && err.message) ? err.message : "") + " - suele ser un problema de conexion. Reintenta.");
    });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
